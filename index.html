<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* layout: fixed dark rail of 14 directions + light content pane with tabs */
:root{
  --bg:#f6f4f0; --surface:#ffffff; --surface-2:#f0ede7; --border:#e2ddd3;
  --fg:#1d1a15; --fg-muted:#6b6355; --accent:#c4621a; --accent-fg:#ffffff;
  --good:#2f7a4f; --warn:#b8862f; --bad:#b4402a;
  --rail-bg:#171410; --rail-fg:#e8e2d6; --rail-fg-dim:#8d8577; --rail-active:#2a251d;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Sora',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1d1a15; --surface-2:#242019; --border:#352f25;
    --fg:#eee9df; --fg-muted:#a39b8a; --accent:#e08a3c; --accent-fg:#1d1a15;
    --good:#5bc383; --warn:#e0b359; --bad:#e2715a;
    --rail-bg:#0c0a08; --rail-fg:#e8e2d6; --rail-fg-dim:#746c5d; --rail-active:#1d1a15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1d1a15; --surface-2:#242019; --border:#352f25;
  --fg:#eee9df; --fg-muted:#a39b8a; --accent:#e08a3c; --accent-fg:#1d1a15;
  --good:#5bc383; --warn:#e0b359; --bad:#e2715a;
  --rail-bg:#0c0a08; --rail-fg:#e8e2d6; --rail-fg-dim:#746c5d; --rail-active:#1d1a15;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--rail-bg);color:var(--fg);font-family:var(--body);margin:0;padding:0 0 18px;font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
/* The whole app is framed as one rounded card against the darker page
   backdrop, so scrolling to the very bottom ends in a finished rounded
   corner instead of an abrupt square cutoff. */
.app{display:flex;min-height:calc(100vh - 18px);border-radius:0 0 18px 18px;overflow:hidden;background:var(--bg)}
.rail{width:220px;flex:none;background:var(--rail-bg);color:var(--rail-fg);display:flex;flex-direction:column;padding:18px 0 0;min-height:100vh;position:sticky;top:0;align-self:flex-start;border-radius:0 0 0 18px}
.rail-brand{padding:0 18px 16px;border-bottom:1px solid #2a251d;margin-bottom:10px;border-radius:6px;transition:background .15s}
.rail-brand:hover{background:var(--rail-active)}
.rail-brand.active{background:var(--rail-active)}
.rail-brand.active .name{color:var(--accent)}
.rail-brand .name{font-family:var(--display);font-weight:700;font-size:16px;color:#fff}
.rail-brand .tag{font-size:11px;color:var(--rail-fg-dim);margin-top:2px}
.rail-list{list-style:none;margin:0;padding:0;overflow-y:auto}
.rail-item{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--rail-fg-dim);cursor:pointer;font-size:13px;border-left:3px solid transparent}
.rail-item .n{font-family:var(--mono);font-size:10.5px;opacity:.7;width:16px}
.rail-item:hover{background:#1b1712;color:var(--rail-fg)}
.rail-item.active{background:var(--rail-active);color:#fff;border-left-color:var(--accent)}
.mode-row:hover{background:var(--rail-active)}
.mode-row.sel{background:color-mix(in srgb, var(--accent) 22%, transparent)}
.mode-row.sel div:first-child{color:var(--accent)}
.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1200px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.header .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);margin-bottom:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:13px;color:var(--fg-muted);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted)}
.kpi .value{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:4px}
.kpi .sub{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--fg-muted)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.home-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.home-col-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.home-col-side{display:flex;flex-direction:column;gap:16px;min-width:340px}
.home-events-card .list{max-height:520px;overflow-y:auto}
.side-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.side-card-head .modal-label{margin-bottom:0}
.side-add-btn{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--fg);font-size:16px;line-height:1;cursor:pointer}
.side-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.side-add-form{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.side-add-form input{width:100%}
.yeartabs{display:flex;gap:6px;margin-bottom:14px}
.yeartabs button{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg)}
.yeartabs button.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
input[type=text],textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;color:var(--fg);padding:8px 10px;font:inherit}
textarea{resize:vertical;min-height:54px}

const DIRECTIONS = [
  {slug:'academy', n:'01', name:'Академия'},
  {slug:'institute', n:'02', name:'Институт'},
  {slug:'afisha', n:'03', name:'Афиша'},
  {slug:'eventchat', n:'04', name:'Event Chat'},
  {slug:'entcity', n:'05', name:'Entertainment City'},
  {slug:'production', n:'06', name:'Продюсирование'},
  {slug:'events', n:'07', name:'Ивенты и концерты'},
  {slug:'artist', n:'08', name:'Менеджер артиста'},
  {slug:'slt', n:'09', name:'СЛТ'},
  {slug:'marketing', n:'10', name:'Маркетинг и продажи'},
  {slug:'smm', n:'11', name:'SMM'},
  {slug:'finance', n:'12', name:'Финансы и инвестиции'},
  {slug:'explosives', n:'13', name:'Взрывтехнологии'},
  {slug:'backoffice', n:'14', name:'Back Office'},
];

// Role title each direction's auto-responder answers under. Finance is a director,
// everyone else is "РМ <направление>", per Kairat's naming rule.
function roleTitle(slug){
  if(slug==='general') return 'Гл менеджер';
  if(slug==='finance') return 'Финансовый директор';
  const d = DIRECTIONS.find(x=>x.slug===slug);
  return d ? `РМ ${d.name}` : 'РМ';
}
// Mentionable targets for the "@" picker inside any direction chat: every direction's
// role plus the general-purpose "Гл менеджер".
const MENTION_TARGETS = [
  {slug:'general', label:'Гл менеджер', hint:'Общий ассистент Eventer Workspace'},
  ...DIRECTIONS.map(d=>({slug:d.slug, label:roleTitle(d.slug), hint:d.name})),
];

const ACADEMY_SHEETS = {
  2026: '1iPnCtqxLoMNb3Ykh3sMHtB-AA27w35DYa1v_ZXI9RY8',
  2027: '1u3L0masfYUKqwvD4ByxGqtYJxbzQfmFf8UUQuBZWXAs',

ктура и ФОТ запуска Event Producer\n\n1. Все ставки сотрудников фиксируются как суммы на руки по гибридной модели: фиксированная часть плюс премия. Полный расход работодателя рассчитывается отдельно; до проверки бухгалтером используется резерв 30% поверх выплат на руки.\n2. Генеральный менеджер — Кайрат Кульбаев: 1 000 000 ₸ фиксированно и до 300 000 ₸ премии.\n3. Операционный директор — Роман: 900 000 ₸ фиксированно и до 300 000 ₸ премии.\n4. Руководитель программы Event Producer — срочная вакансия с сентября 2026 года: 700 000 ₸ фиксированно и до 300 000 ₸ премии. Роль отвечает за целостность программы, международные стандарты, образовательный результат, доходимость, дополнительные занятия и сквозной курсовой проект.\n5. Менеджер по продажам — Молдир: 400 000 ₸ фиксированно и до 300 000 ₸ премии.\n6. Администратор LMS — вакансия с 15.09.2026: 250 000 ₸ фиксированно и до 50 000 ₸ премии.\n7. Ведущий куратор — с 01.10.2026: 400 000 ₸ фиксированно и до 100 000 ₸ премии.\n8. Групповой куратор: 300 000 ₸ фиксированно и до 50 000 ₸ премии. Плановая численность: ноябрь — 1, декабрь — 3, январь — 5, февраль — 8, с марта 2027 года — 9.\n9. Руководитель учебного центра и карьерный центр являются неактивными вакансиями с ФОТ 0 ₸ до запуска Event Manager. Термин Eventer Space в штатной структуре не используется.\n10. Штатный руководитель маркетинга — 0 человек и ФОТ 0 ₸; маркетинговая функция тестируется через агентство и учитывается как подрядчик.\n11. Бэк-офис работает на аутсорсе: общий бюджет 300 000 ₸ в месяц, включая бухгалтерию 200 000 ₸, юриста, HR и других специалистов. Бэк-офис не входит в ФОТ.\n12. Плановый полный ФОТ с максимальными премиями и резервом 30%: сентябрь — 5 655 000 ₸; октябрь — 6 500 000 ₸; ноябрь — 6 955 000 ₸; декабрь — 7 865 000 ₸; январь — 8 775 000 ₸; февраль — 10 140 000 ₸; с марта — 10 595 000 ₸ ежемесячно. Плановый ФОТ 2027 года — около 124 865 000 ₸.\n13. Точные налоги и обязательные платежи работодателя должны быть подтверждены бухгалтером и заменить резерв 30% в финансовой модели.\n\nОбоснование: Ежемесячные пересекающиеся когорты требуют масштабируемой команды и прозрачного разделения штатного ФОТ, премий и подрядчиков. Гибридная оплата связывает расходы с результатами, а поэтапный найм исключает преждевременное содержание учебного и карьерного центров.","ts":1788172138821,"ws_id":10},{"id":"academy_dec_11","direction":"academy","done":false,"text":"[ПРИНЯТО] Анна Снегина — эксперт урока о международных стандартах\n\nАнна Снегина назначается экспертом нового урока 1.6 «Международная профессиональная экосистема Event-индустрии: организации, стандарты и руководства». Урок должен раскрыть профессиональные организации, CMP, CMP-IS, EMBOK, EMICS, ISO 20121, Green Guide, Purple Guide и профильные рекомендации HSE, объясняя назначение и область применения каждого источника.\n\nОбоснование: Необходимо дать студентам системное понимание международной профессиональной экосистемы и научить выбирать подходящий источник для конкретной профессиональной задачи.","ts":1788277356428,"ws_id":11},{"id":"academy_dec_12","direction":"academy","done":false,"text":"[ПРИНЯТО] Продажи Event Producer: самостоятельный путь, консультации и оплата\n\nПРИНЯТО.\n1. Продажа строится через самостоятельный выбор пользователя: после заявки доступны «Выбрать оплату», «Задать вопрос менеджеру» и «Вернуться к программе». Менеджер подключается только по запросу.\n2. Первые две недели после старта продаж Кайрат отвечает на вопросы пользователей, чтобы собрать реальные возражения. Максимальное время первого ответа — 2 рабочих часа. Роман, операционный директор, подтверждает успешную оплату, контролирует создание студента в CRM и передачу в LMS.\n3. Форма заявки: имя, Telegram или телефон, email, страна и согласие на обработку персональных данных; Event Producer подставляется автоматически.\n4. При оплате доступны полная оплата и рассрочка без переплаты. Общая стоимость для студента не увеличивается — расходы по рассрочке берёт на себя Academy.\n5. Если оплата выбрана, но не завершена: через 24 часа одно нейтральное напоминание. Пауза: через 3–4 дня одно полезное сообщение, затем автоматические сообщения прекращаются.\n6. Запись на звонок: доступность Кайрата ежедневно 09:00–19:00 Алматы; слоты по 30 минут с буфером 15 минут; статус CRM «Консультация назначена».\n7. Все консультации должны записываться и транскрибироваться. Запись и транскрипция сохраняются в карточке лида; ИИ выделяет вопрос, возражение, результат и следующий шаг. Выбор сервиса и срок хранения — отдельное решение.\n8. После подтверждения оплаты — статус «Студент», приветствие и запуск онбординга в LMS.\n\nОбоснование: Утверждено в рабочем обсуждении запуска Event Producer.","ts":1788596210045,"ws_id":12},{"id":"academy_dec_13","direction":"academy","done":false,"text":"[ПРИНЯТО] Консультации, записи звонков и тест воронки Event Producer\n\nПРИНЯТО. Консультации проводятся через Google Meet. Запись и транскрипция включаются после согласия пользователя; видеозапись хранится 90 дней, затем в CRM остаются транскрипция и итог. Доступ к записям: Кайрат, Роман и менеджер конкретного лида; для остальных — только итоговая транскрипция.\nПРИНЯТО. В карточке лида фиксируются время обращения, первый ответ и ответственный; норматив первого ответа — до 2 рабочих часов. Первые две недели отвечает Кайрат.\nПРИНЯТО. Полный тестовый путь проводится 10 сентября: реклама → сайт → заявка → бот → запись на звонок → оплата → статус «Студент» → LMS. Проверяются все уведомления, статусы и передача ответственности.\n\nОбоснование: Утверждено в рабочем обсуждении запуска Event Producer.","ts":1788598229647,"ws_id":13},{"id":"academy_dec_14","direction":"academy","done":false,"text":"[ПРИНЯТО] Тестовый запуск воронки Event Producer до старта продаж\n\nПРИНЯТО. Полный тестовый путь проводится 10 сентября: реклама → сайт → заявка → бот → запись на Google Meet → оплата → статус «Студент» → LMS. Подготовка системы завершается до 9 сентября, 18:00 Алматы; повторная проверка проблемных мест — 11 сентября. Критичные ошибки блокируют старт продаж 16 сентября; некритичные собираются в отдельный список. Период 16–30 сентября — замер спроса и воронки без автоматического масштабирования рекламы; по итогам принимается решение о масштабировании.\n\nОбоснование: Утверждено для запуска продаж 16 сентября 2026 года.","ts":1788599380630,"ws_id":14},{"id":"academy_dec_15","direction":"academy","done":false,"text":"[ПРИНЯТО] Коммуникационный контур когорты Event Producer\n\nПРИНЯТО. Для первой когорты создаются только два постоянных пространства: канал когорты для официальной информации Academy и общий чат когорты для общения студентов и куратора. Технические и организационные обращения идут через кнопку поддержки в LMS или бота, а не в отдельный чат. Чаты проектных команд создаются только на этапе сквозного проекта.\n\nОбоснование: Утверждено для удобной коммуникации первой когорты.","ts":1788659336158,"ws_id":15},{"id":"academy_dec_16","direction":"academy","done":false,"text":"[ПРИНЯТО] Порядок пересборки задач запуска Event Producer\n\nПРИНЯТО. Пересборка задач запуска Event Producer выполняется в следующем порядке: сначала фиксируются все задачи первого уровня; затем для каждой из них определяются задачи второго уровня; затем для подзадач формируются предметные и простые чек-листы; после согласования новой структуры проводится чистка текущего списка задач с удалением дублей только по прямому подтверждению Кайрата.\n\nОбоснование: Утверждён пошаговый порядок, чтобы пересобрать систему задач без потери контекста и без хаотичного создания и удаления записей.","ts":1788751598258,"ws_id":16},{"id":"academy_dec_17","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура второго блока задач запуска Event Producer: готовность LMS\n\nПРИНЯТО. Второй блок верхнего уровня в системе задач запуска Event Producer называется «Проверить готовность LMS Event Producer». Смысл блока: подтвердить, что образовательный контент полностью загружен в LMS, платформа стабильно работает, имеет понятный интерфейс, приятный и интуитивно понятный UX/UI, корректную навигацию, личный кабинет студента, кабинет куратора и административные панели, а также прошла независимое тестирование на представителях разных целевых групп. Для собственной LMS Academy готовность оценивается не только по внутренней проверке, но и по сравнительному аудиту с лидерами рынка GetCourse и iSpring. Сравнение проводится по ключевым сценариям и параметрам: путь студента, навигация по программе, кабинет студента, кабинет куратора, административная панель, логика заданий и тестов, отображение прогресса, уведомления и коммуникации, мобильное удобство, аналитика и контроль прохождения, стабильность, скорость работы и готовность к масштабированию. Блок считается закрытым только после подтверждения, что LMS готова к приёму студентов и не имеет критических сбоев или незакрытых блокеров запуска.\n\nОбоснование: Зафиксирована согласованная логика второго верхнеуровневого блока задач, чтобы проверка LMS охватывала не только загрузку контента, но и реальную продуктовую, техническую и пользовательскую готовность платформы к запуску Event Producer.","ts":1788752282068,"ws_id":17},{"id":"academy_dec_18","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура третьего блока задач запуска Event Producer: готовность лендинга\n\nПРИНЯТО. Третий блок верхнего уровня в системе задач запуска Event Producer называется «Проверить готовность лендинга Event Producer». Смысл блока: подтвердить, что пользователь может удобно, понятно и информативно ознакомиться с программой на сайте, снять основные вопросы, принять осознанное решение и без лишнего трения перейти к следующему действию: оставить заявку, записаться на консультацию или перейти к оплате. В блок входит проверка полноты и актуальности информации о программе, логики пользовательского пути, UX/UI лендинга, корректности форм захвата, технической готовности сайта к работе с контактами, мобильной версии и пользовательского контура оплаты как части пути на сайте. Аналитика, CRM-логика и последующие статусные переходы контролируются в других блоках. Внутри блока также обязательно выделяется подзадача на проведение теста зависимых пользовательских сценариев и связанных пользовательских путей, чтобы подтвердить, что ключевые действия на лендинге работают не изолированно, а как единая связанная система.\n\nОбоснование: Зафиксирована согласованная логика третьего верхнеуровневого блока задач, чтобы лендинг оценивался не только как страница с информацией, но как полноценный рабочий инструмент осознанной покупки и приёма пользователя в воронку Event Producer.","ts":1788752734973,"ws_id":18},{"id":"academy_dec_19","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура четвертого блока задач запуска Event Producer: готовность CRM\n\nПРИНЯТО. Четвертый блок верхнего уровня в системе задач запуска Event Producer называется «Проверить готовность CRM Event Producer». Смысл блока: подтвердить, что CRM полностью готова к приему, ведению, передаче и контролю контактов, лидов и студентов по всей логике запуска Event Producer. В блок входит проверка структуры воронки CRM, карточки контакта и лида, фиксации источника, кампании и креатива, распределения ответственных, уведомлений, интеграции с формой заявки, ботом, записью на консультацию, оплатой и переходом в статус «Студент», а также аналитики и контроля движения по воронке. В составе блока отдельно выделяется проверка синхронизации CRM с дашбордом Eventer Academy по направлению «Маркетинг и продажи», чтобы статусы воронки, количества контактов, лидов, переходов в «Выбор оплаты», студентов, атрибуция источников и данные по продукту корректно и без искажений отображались в дашборде для управленческого контроля.\n\nОбоснование: Зафиксирована согласованная логика четвертого верхнеуровневого блока задач, чтобы CRM оценивалась не только как внутренняя база контактов, но как рабочая система управления воронкой и источник корректных данных для дашборда Eventer Academy.","ts":1788756795309,"ws_id":19},{"id":"academy_dec_2","direction":"academy","done":false,"text":"[ПРИНЯТО] Расписание программы Event Manager: 4 месяца очного обучения + 2 месяца практики\n\nДля программы Event Manager принята следующая модель расписания и структуры обучения. Первые 4 месяца — очное обучение в центре. Формат: 3 учебных дня в неделю, с 09:00 до 16:00. Внутри дня: 6 учебных часов и 1 час на обед. Общая недельная нагрузка: 18 очных часов. Общий объём за 16 недель: 288 очных часов. Дополнительно предусмотрены 2 домашних блока в неделю. Следующие 2 месяца — 8 стажировок, дипломный проект и портфолио. Структура учебного дня: 09:00–09:20 — короткий видеоурок; 09:20–09:40 — обсуждение и постановка задачи; 09:40–11:40 — практический блок; 11:40–13:00 — проектная работа; 13:00–14:00 — обед; 14:00–15:00 — профессиональный блок: митап, встреча с экспертом, разбор проекта или подготовка к стажировке; 15:00–15:45 — продолжение работы и обратная связь; 15:45–16:00 — итоги дня и постановка домашней работы. Дополнительно зафиксировано: темы отдельных занятий пока не расписываются, а фиксируются только направления; митапы входят в учебные часы; Simulation Lab в описании программы пока не упоминается; возможность совмещения с работой не является требованием программы. Предыдущая рабочая гипотеза «3 дня по 4 часа» больше не является актуальной для действующей модели расписания.\n\nОбоснование: Зафиксировать фактически согласованную модель расписания Event Manager в едином реестре решений и устранить расхождение со старой рабочей гипотезой в концепции.","ts":1787827195747,"ws_id":2},{"id":"academy_dec_20","direction":"academy","done":false,"text":"[ПРИНЯТО] Единый контур Telegram и ИИ-ассистентов Workspace\n\nРазвивать Telegram Mini App как мобильный канал Workspace: подключать выбранные рабочие чаты Telegram, направлять задачи сотрудникам, получать ответы, комментарии и файлы обратно в карточки задач, а ИИ-менеджеру — обрабатывать ответы и обновлять статусы. Подключить контекстных ИИ-ассистентов для Eventer Academy, Afisha.kz, SMM и Entertainment City. Добавить финансового директора в локальный Back Office и обеспечить доступ к нему через мобильный интерфейс Workspace на iPhone. Обычную переписку не превращать в задачи без явного поручения; права и подключение чатов контролирует администратор.\n\nОбоснование: Создать единый мобильный рабочий контур без потери контекста между Workspace, локальными менеджерами и Telegram.","ts":1788765871042,"ws_id":20},{"id":"academy_dec_21","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура пятого блока задач запуска Event Producer: готовность рекламной кампании\n\nПРИНЯТО. Пятый блок верхнего уровня в системе задач запуска Event Producer называется «Проверить готовность рекламной кампании Event Producer». Смысл блока: подтвердить, что весь внешний контур привлечения готов к запуску и работает как единая система привлечения внимания, переходов и заявок на Event Producer. В блок входят готовность оффера и ключевых рекламных сообщений, готовность SMM Eventer Academy, готовность контура Кайрата Кульбаева как отдельного канала доверия и привлечения, готовность сайта как точки приёма рекламного трафика, готовность рекламных креативов и форматов, корректность ссылок, UTM-меток и маршрутов перехода, а также готовность аналитики рекламной кампании. Отдельно в состав блока включается подзадача «Проверить готовность маркетингового агентства к запуску рекламной кампании» с проверкой согласованности договора, зоны ответственности, переданных доступов и материалов, готовности медиаплана, структуры рекламных кампаний, запуска таргета и формата отчётности. Лендинг как продуктовая страница проверяется в отдельном третьем блоке, а в пятом блоке сайт проверяется именно как часть рекламной системы и маршрута трафика.\n\nОбоснование: Зафиксирована согласованная логика пятого верхнеуровневого блока задач, чтобы готовность рекламной кампании оценивалась не только по наличию рекламы, а по целостной готовности каналов, подрядчика, сайта и аналитики к управляемому запуску Event Producer.","ts":1788766325854,"ws_id":21},{"id":"academy_dec_22","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура шестого блока задач запуска Event Producer: готовность организационной схемы\n\nПРИНЯТО. Шестой блок первого уровня в системе задач запуска Event Producer называется «Проверить готовность организационной схемы запуска Event Producer». Смысл блока: подтвердить, что для запуска определены оргструктура, роли, функции, зоны ответственности, ожидаемые результаты по каждой роли, а также инструкции и онбординг, чтобы каждый сотрудник и специалист понимал, что именно он делает, за что отвечает и какой результат должен выдать Eventer Academy. В блок входят разработка оргструктуры запуска Event Producer, определение ролей и зон ответственности по всем участникам запуска, определение функций и ожидаемых результатов по каждой роли, подготовка инструкций и регламентов по ключевым ролям, подготовка онбординга сотрудников и привлечённых специалистов, проверка каналов взаимодействия и порядка эскалации, а также проверка готовности команды работать по утверждённой организационной схеме.\n\nОбоснование: Зафиксирована согласованная логика шестого верхнеуровневого блока задач, чтобы запуск Event Producer опирался не только на продукт, маркетинг и технологии, но и на понятную управляемую организационную модель с ясной ответственностью и ожидаемым результатом по каждой роли.","ts":1788771950372,"ws_id":22},{"id":"academy_dec_23","direction":"academy","done":false,"text":"[ПРИНЯТО] Название проекта и задач запуска Event Producer\n\nПРИНЯТО. Рабочий проект запуска переименовывается в «Старт обучения Event Producer». Верхнеуровневые и связанные задачи в этом контуре должны называться с явной припиской «Event Producer», чтобы сохранялась однозначная привязка к продукту и не возникало путаницы между задачами разных проектов Eventer Academy.\n\nОбоснование: Зафиксировано по прямому подтверждению Кайрата, чтобы унифицировать нейминг проекта и задач и убрать расхождения в структуре запуска.","ts":1788783091251,"ws_id":23},{"id":"academy_dec_26","direction":"academy","done":false,"text":"[ПРИНЯТО] Обновление календаря запуска и плана набора Event Producer\n\nПРИНЯТО. Календарь запуска Event Producer обновляется: старт рекламной кампании — 7 октября 2026 года, начало обучения первой когорты — 4 ноября 2026 года. План набора обновляется следующим образом: в ноябре 2026 года — 25 студентов, в декабре 2026 года — 50 студентов, далее с января 2027 года действует ранее принятый план масштабирования. Финансовая модель Eventer Academy по Event Producer должна быть пересчитана и актуализирована под новый календарь запуска и обновлённый план набора.\n\nОбоснование: Зафиксировать новый календарь запуска и параметры набора, чтобы синхронизировать план продаж, обучение и финансовую модель Event Producer.","ts":1788827860832,"ws_id":26},{"id":"academy_dec_27","direction":"academy","done":false,"text":"[ПРИНЯТО] Формат подзадач для проверки готовности LMS Event Producer\n\nПРИНЯТО. Задача «Проверить готовность LMS Event Producer» должна собираться в чистом укрупнённом формате без лишнего дробления. Верхний уровень включает 5 подзадач: 1) Проверить контент и структуру обучения; 2) Проверить пользовательский путь и кабинеты; 3) Проверить функционал администрирования и поддержки; 4) Проверить качество работы и удобство LMS; 5) Проверить готовность через тестирование и сравнение с рынком. Детализация выносится в чек-листы внутри подзадач. В описании верхней задачи и подзадач должна быть кратко зафиксирована суть проверки.\n\nОбоснование: Зафиксировать единый рабочий формат постановки задач по LMS: короткие и чёткие формулировки, укрупнённые подзадачи, детали в чек-листах, без лишней суеты и однотипного дробления.","ts":1788845626588,"ws_id":27},{"id":"academy_dec_28","direction":"academy","done":false,"text":"[ПРИНЯТО] Формулировка пятой подзадачи CRM Event Producer без слова «атрибуция»\n\nПРИНЯТО. В структуре задач по проверке готовности CRM Event Producer пятая подзадача должна формулироваться без слова «атрибуция». Корректная формулировка: «Проверить аналитику, источники и синхронизацию с дашбордом».\n\nОбоснование: Зафиксировать понятную и естественную для команды формулировку подзадачи без профессионального англицизма, сохранив при этом смысл проверки источников и аналитики CRM.","ts":1788860133018,"ws_id":28},{"id":"academy_dec_29","direction":"academy","done":false,"text":"[ПРИНЯТО] Структура подзадач для проверки готовности CRM Event Producer\n\nПРИНЯТО. Для родительской задачи «Проверить готовность CRM Event Producer» используется следующая структура из 5 подзадач: 1) Проверить структуру воронки и статусы CRM; 2) Проверить карточки контакта, лида и обязательные поля; 3) Проверить интеграции CRM с точками входа и переходами; 4) Проверить логику работы ответственных, уведомлений и контроля; 5) Проверить аналитику, источники и синхронизацию с дашбордом. Детализация каждой подзадачи формируется чек-листами внутри подзадач. Физическое создание задач и заполнение чек-листов выполняется отдельным действием только после команды Кайрата «делай».\n\nОбоснование: Зафиксировать согласованную структуру подзадач CRM Event Producer и исключить неоднозначность перед последующим созданием задач в Eventer Academy.","ts":1788860298614,"ws_id":29},{"id":"academy_dec_3","direction":"academy","done":false,"text":"[ПРИНЯТО] Учебный ритм и нагрузка программы Event Manager\n\nПервые четыре месяца программы Event Manager проходят в следующем ритме: понедельник, среда и пятница — очные занятия в физическом центре с 09:00 до 14:00, с одним кофе-брейком 20 минут. Чистое очное учебное время — 4 часа 40 минут в день, 14 часов в неделю и 224 часа за 16 недель. Вторник и четверг — обязательные домашние учебные дни с 09:00 до 12:00: 3 часа в день, 6 часов в неделю и 96 часов за четыре месяца. Во вторник студент дорабатывает результат понедельника, проходит короткую проверку знаний, выполняет индивидуальное практическое задание и сдаёт результат в LMS. В четверг студент продолжает кейс среды, исправляет замечания и готовит документ или решение к пятничному разбору; при необходимости получает консультацию ассистента или куратора. Полноценные трёхчасовые онлайн-занятия во вторник и четверг не проводятся. Контроль: LMS, первичная проверка ИИ-ассистентом, учебный ассистент и куратор при необходимости. Общая нагрузка — 20 учебных часов в неделю и 320 часов за первые четыре месяца. Затем два месяца стажировок, подготовки дипломного проекта, защиты и карьерного сопровождения. Это решение заменяет Решение №002 от 27.08.2026 и все прежние варианты расписания: 09:00–16:00, занятия по 4 или 6 часов в центре, пятидневное очное расписание и режим 09:00–13:00 плюс домашняя работа 14:00–18:00.\n\nОбоснование: Зафиксировать последнюю согласованную учебную модель Event Manager и устранить противоречие с ранее сохранённым Решением №002.","ts":1788142647112,"ws_id":3},{"id":"academy_dec_30","direction":"academy","done":false,"text":"[ПРИНЯТО] Два параллельных входа в воронку Event Manager: профориентационный онбординг и игра «Один день в Event-агентстве»\n\nПРИНЯТО. Для верхнего входа в воронку Event Manager используется вариант с двумя параллельными сценариями привлечения в одну общую систему. Первый внешний вход — профориентационный интерактивный онбординг с обещанием помочь человеку понять, подходит ли ему профессия Event Manager. Второй внешний вход — игровая симуляция с рекламным оффером «Один день в Event-агентстве». Обе ветки работают как самостоятельные рекламные точки входа, но далее сходятся в общую воронку и ведут человека к следующему осознанному шагу в зависимости от его готовности: продолжение знакомства, Tripwire, консультация или основной продукт. Игру не считать только внутренним продуктом и не ограничивать только вторым шагом после онбординга; она сохраняется как полноценный внешний рекламный вход, который также при необходимости может использоваться внутри воронки.\n\nОбоснование: Сохранить сильный рекламный оффер игровой симуляции, не теряя при этом более мягкий профориентационный вход для холодной аудитории. Два параллельных входа позволяют тестировать разные типы мотивации и сводить их в единую воронку Event Manager без искусственного ограничения одного сценария.","ts":1788918033871,"ws_id":30},{"id":"academy_dec_31","direction":"academy","done":false,"text":"[ПРИНЯТО] Архитектура входа в воронку Event Manager: онбординг, игра и следующий шаг\n\nПРИНЯТО. Для верхнего входа в воронку Event Manager сохраняются два параллельных внешних сценария привлечения в одну общую систему: 1) профориентационный интерактивный онбординг с обещанием помочь человеку понять, подходит ли ему профессия Event Manager; 2) игра-симуляция с внешним рекламным оффером «Один день в Event-агентстве». При этом игра не считается только внутренним продуктом: она может использоваться как самостоятельный внешний рекламный вход и как следующий шаг внутри воронки после онбординга. Внутри логики прогрева сначала человек может пройти мягкую самодиагностику через онбординг, затем закрепить интерес и проверить отклик через симуляцию, после чего система должна переводить его в следующий шаг по степени готовности: дополнительный контент и контакт, Tripwire, консультация или основной продукт Event Manager. Из игры или онбординга не вести всех пользователей напрямую в продажу полного продукта стоимостью 1 500 000 ₸; переход к офферу зависит от уровня осознанности, интереса и готовности пользователя.\n\nОбоснование: Зафиксировать согласованную архитектуру верхней части воронки Event Manager для дорогого продукта: сохранить сильный рекламный оффер игры, не потерять мягкий профориентационный вход для холодной аудитории и связать оба сценария с дальнейшей логикой прогрева, Tripwire и основной продажи.","ts":1788918096416,"ws_id":31},{"id":"academy_dec_32","direction":"academy","done":false,"text":"[ПРИНЯТО] Размещение раздела «Орг схема» рядом с «Продукт-карта» в Workspace Академии\n\nПРИНЯТО. В интерфейсе Workspace Eventer Academy справа от кнопки «Продукт-карта» размещается отдельная кнопка «Орг схема». При открытии кнопки пользователь попадает на экран, где доступны как минимум два слоя просмотра: 1) общая организационная схема Eventer Academy; 2) операционные схемы запуска отдельных программ, начиная с Event Producer. В дальнейшем в этом же разделе должны добавляться схемы запуска других программ Академии.\n\nОбоснование: Нужно разделить продуктовую архитектуру и организационно-управленческий контур. «Продукт-карта» отвечает за структуру продукта, а «Орг схема» — за структуру Академии и запусков. Размещение рядом помогает быстро переключаться между двумя связанными, но разными управленческими представлениями.","ts":1788929600672,"ws_id":32},{"id":"academy_dec_33","direction":"academy","done":false,"text":"[ПРИНЯТО] Принцип планирования сроков по родительским задачам и подзадачам запуска Event Producer\n\nПРИНЯТО. Для задач запуска Event Producer сроки планируются по следующему принципу. 1) Родительские задачи не закрываются за один день как единица планирования; в ежедневном ритме планируются подзадачи. 2) Реалистичная норма закрытия — 2–4 подзадачи в день, если это проверочные задачи без глубокой разработки. 3) Родительская задача закрывается только после закрытия всех её подзадач. 4) Для родительской задачи из 5–7 подзадач базовый срок ставится на 3–5 рабочих дней от старта блока. 5) Задачи без срока не оставляются; всем активным родительским задачам и подзадачам должны быть назначены сроки. 6) Приоритет датирования и прохождения блоков текущего запуска: сначала лендинг, затем CRM, затем рекламная кампания, затем организационная схема, затем LMS, затем образовательный контент. 7) Базовый рабочий темп текущего периода — около 3 подзадач в день без перегруза команды.\n\nОбоснование: Нужен единый управленческий принцип постановки сроков, чтобы даты были реалистичными, поддавались ежедневному контролю и не превращались в формальные дедлайны без фактического исполнения.","ts":1788945095040,"ws_id":33},{"id":"academy_dec_4","direction":"academy","done":false,"text":"[РАБОЧАЯ ГИПОТЕЗА] Архитектура Simulation Lab: сквозной проект и глубокие симуляции\n\nВместо действующей в старых документах модели 11 модулей × 5 сегментов = 55 отдельных часовых тренировок проверить новую архитектуру Simulation Lab: один сквозной event-проект, который студент развивает по мере прохождения 11 модулей, и 11 глубоких профессиональных симуляций продолжительностью до учебной недели. Внутри симуляции используются переписка, документы, самостоятельная работа, новые вводные и отдельные видеовстречи с живым тренером. Модули 1–4 ведут от запроса клиента и брифа к концепции, плану, бюджету и коммерческому предложению; модули 5–9 — к реализации; затем отдельный День X; модуль 10 — Review и закрытие проекта; модуль 11 предварительно рассматривается как финальная комплексная проверка на новом проекте. Simulation Lab должен быть модулем существующей LMS Eventer Academy с кабинетами студента, тренера и администратора. До утверждения архитектуры и финансовой модели не начинать разработку полной production-версии: сначала спроектировать один пилотный сквозной проект и проверить его с реальным студентом и тренерами. Модель 55 тренировок и прежние расчёты себестоимости сохраняются в истории, но не используются как актуальная основа планирования до завершения пилота.\n\nОбоснование: Глубокая профессиональная симуляция включает документы, переговоры, переписку и последствия решений, поэтому часовой формат и механическое проведение 55 тренировок могут быть избыточными. Гипотезу необходимо проверить пилотом до окончательного утверждения. А может структуру кураторов в GPT в левом меню кураторов","ts":1788143033827,"ws_id":4},{"id":"academy_dec_43","direction":"academy","done":false,"text":"[ПРИНЯТО] Дополнение к воронке Event Producer: самостоятельная покупка и консультация\n\nПуть студента строится от конкретной программы, без отдельного шага выбора программы: реклама ведёт на лендинг программы; при понятном предложении пользователь самостоятельно выбирает оплату или рассрочку; после подтверждённой оплаты становится студентом и получает доступ к LMS и онбордингу. Если остаются вопросы, пользователь запрашивает консультацию — в CRM создаётся контакт/лид и назначается ответственный; принудительный звонок не используется. Посетитель без оставленных контактов учитывается только в аналитике и ретаргетинге. Для контакта с согласием действует деликатная каскадная коммуникация; при незавершённой оплате — нейтральное напоминание через 24 часа, одно полезное сообщение через 3–4 дня, затем остановка. В карточке лида по консультации фиксируются согласие на запись, запись разговора или встречи, транскрипция, краткое резюме и оценка качества; выбор технического решения для телефонии остаётся отдельной задачей внедрения.\n\nОбоснование: Основной объём продаж должен проходить самостоятельно, а консультант подключается только там, где действительно нужен. Все переходы и коммуникации должны быть измеримыми и ненавязчивыми.","ts":1789992033774,"ws_id":43},{"id":"academy_dec_44","direction":"academy","done":false,"text":"[ПРИНЯТО] Порядок подготовки рекламного запуска Event Producer и роль маркетолога\n\n1. До постановки задачи SMM-менеджеру проводится аудит действующей маркетинговой стратегии Academy: соответствуют ли ей актуальная продуктовая линейка, цены и обещания программ, финансовая модель 2026, план набора, календарь запуска и утверждённая воронка продаж. При выявлении расхождений стратегия актуализируется до начала рекламного запуска. 2. Маркетолог на основе актуальной стратегии, финансовой модели, плана продаж и воронки готовит ТЗ на рекламный запуск Event Producer. В ТЗ фиксируются: цель набора и дата, бюджет и допустимая экономика привлечения, аудитории и страны, каналы, медиаплан, рекламные кабинеты и доступы, ответственный за настройку и ведение таргета, маршрут кампаний до CRM и оплаты, а также метрики остановки или масштабирования. 3. После согласования Кайратом ТЗ PM Academy ставит SMM-менеджеру задачу на креативы, тексты и медиаплан. SMM-менеджер передаёт материалы Кайрату на утверждение. 4. PM Academy ведёт единый «Паспорт запуска рекламной кампании» в Workspace: Академия → Маркетинг и продажи → Event Producer; ссылка на него размещается в задаче 234/4. Паспорт включает утверждённые материалы, план кампании, технический маршрут, аналитику, роли, блокеры и статус готовности. 5. Маркетолог отвечает за логику и сверку дашборда маркетинга и продаж: плановые показатели берутся из финансовой модели и плана запуска; фактические рекламные данные предоставляет SMM, результаты воронки — CRM; внутренний разработчик обеспечивает техническую синхронизацию. 6. Роли: маркетолог — стратегия, ТЗ и контроль план/факт; SMM-менеджер — креативы, тексты, медиаплан и фактические данные кампаний; внутренний разработчик — ссылки, UTM, формы, CRM, оплату и передачу в LMS; PM Academy — сбор паспорта и контроль полноты; Кайрат — утверждение материалов и решение о пилоте.\n\nОбоснование: Рекламный запуск должен опираться на единую актуальную стратегию и финансовую модель, а не на разрозненные материалы. Это позволяет до запуска видеть ответственных, маршрут данных и измеримый план/факт.","ts":1789993504990,"ws_id":44},{"id":"academy_dec_45","direction":"academy","done":false,"text":"[ПРИНЯТО] Актуализация маркетингового исследования Academy и порядок согласования ТЗ\n\n1. Eventer Academy готовит собственное актуальное маркетинговое исследование. Материалы Venus используются только как источник методики и ранее собранных гипотез, но не как действующая стратегия. 2. Исследование охватывает поисковый спрос и запросы аудитории, анализ конкурентов, аудитории и барьеры к покупке, продуктовую линейку, цены и обещания, каналы привлечения, данные CRM и лендингов, финансовую модель и проверку гипотез. 3. Отдельный обязательный блок — аудит YouTube: имеющиеся наработки, роль канала, целевая аудитория, темы, форматы, показатели и перечень того, что нужно обновить или запустить. 4. PM Academy готовит проект ТЗ для маркетолога на основе действующих решений Workspace, продуктовых планов, финансовой модели и плана запуска. 5. Кайрат согласует ТЗ до постановки задачи маркетологу. Без согласованного ТЗ исследование не считается запущенным. 6. Результат работы маркетолога: актуальное исследование, список изменений в маркетинговой стратегии, приоритеты каналов и план актуализации YouTube; затем Кайрат утверждает действующую версию стратегии.\n\nОбоснование: Нужно перейти от набора старых материалов к единому актуальному основанию для рекламы, продаж и запуска программ, сохранив контроль Кайрата над постановкой задачи и ключевыми решениями.","ts":1789995441822,"ws_id":45},{"id":"academy_dec_46","direction":"academy","done":false,"text":"[ПРИНЯТО] Единый контур подготовки программ Eventer Academy\n\n1. Родительская задача 234 и связанные с ней проверки относятся к подготовке программ Eventer Academy в целом, а не только к Event Producer. 2. В ближайшем контуре запуска одновременно готовятся Event Producer и Event Manager: образовательный контент, LMS, CRM, лендинги, рекламный запуск и организационная схема. 3. Producer Bootcamp включён в общую продуктовую, маркетинговую и финансовую подготовку, но его фактическая дата и город запуска утверждаются отдельно после выбора подходящего крупного события и площадки. 4. Общие платформы и процессы проектируются сразу для всех программ, а различия фиксируются внутри материалов каждой программы.\n\nОбоснование: Академия запускает не один продукт, поэтому общая инфраструктура, стратегия и контроль готовности должны быть едиными, без искусственного сужения к Event Producer.","ts":1789997276246,"ws_id":46},{"id":"academy_dec_48","direction":"academy","done":false,"text":"[ПРИНЯТО] Simulation Lab — приостановлен\n\nSimulation Lab не запускаем в текущей продуктовой модели Eventer Academy. Статус: на паузе.\n\nОбоснование: Уточнение статуса от Кайрата 22.09.2026 (заменяет формулировку «отменено/заменено» из V9.1 маркетинговой стратегии). Приложение в K-Workspace остаётся в реестре, но продукт не в работе.","ts":1790094367346,"ws_id":48},{"id":"academy_dec_49","direction":"academy","done":false,"text":"[ПРИНЯТО] Одновременный запуск Event Producer и Event Manager\n\nEvent Producer и Event Manager запускаем одновременно. Если Academy не успевает подготовить Event Manager к общему старту — допустим сдвиг не более чем на месяц (декабрь 2026), при дальнейшей задержке — январь 2027.\n\nОбоснование: Решение Кайрата от 22.09.2026, отменяет последовательную схему запуска из V9.1 маркетинговой стратегии (где Event Manager запускался отдельной фазой позже, без одновременной полномасштабной кампании).","ts":1790094371580,"ws_id":49},{"id":"academy_dec_5","direction":"academy","done":false,"text":"[ПРИНЯТО] Параметры первого потока Event Producer\n\nДля первого потока онлайн-программы Event Producer устанавливаются следующие параметры набора: минимальный сценарий — 25 студентов, целевой — 35 студентов, максимальный — 50 студентов. Базовая цена программы — 750 000 ₸. Студентам предоставляется возможность оплаты в рассрочку. В финансовой модели должны отдельно отражаться полная цена, комиссия банка или платёжного провайдера и чистое поступление Eventer Academy. Для Казахстана комиссия рассрочки около 18% используется только как рабочее допущение до получения подтверждённых условий конкретного провайдера. Для других стран русскоязычного рынка способы оплаты, комиссии, валюты и юридическая схема определяются отдельно. При наборе 50 студентов необходимо заранее обеспечить учебную мощность, включая разделение потока на подгруппы и достаточное количество кураторов и ассистентов.\n\nОбоснование: Зафиксировать единые параметры набора, цены и оплаты для пересчёта финансовой модели, маркетинговой воронки, нагрузки команды и подготовки запуска Event Producer.","ts":1788165327182,"ws_id":5},{"id":"academy_dec_50","direction":"academy","done":false,"text":"[ПРИНЯТО] Бриф правок сайта eventer.kz (для Михаила)\n\n1. /producer-v2, блок «Инвестиция»: цена $1 000 → 750 000 ₸. Убрать упоминание «Eventer Simulation Lab» из текста-обоснования цены (продукт на паузе). Добавить автоопределение региональной валюты (11 валют СНГ + USD/EUR).\n2. /program, блок цены: убрать WhatsApp-гейт («узнать стоимость в WhatsApp»), показать цену открыто на странице — 1 500 000 ₸ (Event Manager).\n3. /bootcamp, заголовок: «EVENT PRODUCER LEADERSHIP BOOTCAMP» → «Producer Bootcamp».\n4. /bootcamp, дата (встречается дважды на странице): «Алматы · Сентябрь 2026» → «Алматы · конец февраля – март 2027».\n5. /program и /bootcamp, навигация «Тарифы»: ссылка /#packages битая (ведёт на старую версию сайта) — поправить якорь или убрать пункт меню.\n6. Добавить изображения: /producer-v2 (сейчас 1 шт.), /program (2 шт.), /bootcamp (2 шт.) — для сравнения на /v3 их 27.\n7. Био основателя на /v3: расширить — добавить Cirque du Soleil, Carnegie Hall, Dubai Opera, Cannes, Davos. Без ордена «Құрмет».\n\nОбоснование: Сверка live-сайта (eventer.kz) с редактурой сайта 2026 и маркетинговой стратегией V9.1, проведена 22.09.2026. Передаётся Михаилу на исправление по возвращении (сейчас недоступен).","ts":1790095790906,"ws_id":50},{"id":"academy_dec_52","direction":"academy","done":false,"text":"[ПРИНЯТО] Единый реестр структуры курса Event Producer — 69 видео\n\nУтверждён источник правды по контенту курса Event Producer: 69 видеоединиц = 56 уроков (11 модулей: 5,4,5,4,9,4,5,4,4,5,7) + 13 видео Кайрата (1 вступительное + 11 вводных по модулям + 1 заключительное). Прежняя цифра реестра «56 уроков» подтверждена верной; цифра «79» из продакшн-трекера «Видео.Ивент-продюсер» отражает не уроки, а видео-файлы (сплиты уроков на части + 10 рекламных/сайтовых материалов — R1-R7, приветствие, подсъём, 1 вебинар — не являются уроками курса). Создан новый файл «Структура 3.0 — Event Producer» (Google Sheets, папка «Программа обучения») — построчный реестр всех 69 видео с колонками: Блок, Урок №, Название, Спикер, Снято, Смонтировано, Презентация согласована, Упаковано (финал), Ссылка на видео, Ссылка на презентацию, Тест есть, Практика есть, Доп.материалы есть, Блокер/комментарий, Ответственный, Срок. Статус «Снято» заполнен по факту из листа «Структура курса» файла Метко на 23.09.2026: значительная часть уроков модулей 6, 7, 9, 10, 11 не снята.\n\nОбоснование: Расхождение цифр (56 vs 79) мешало точно оценить готовность программы к запуску (задача #238, срок проекта «Старт обучения 2026» — 15.10.2026). Без единого построчного реестра с чётким статусом по каждому видео невозможно контролировать готовность и закрывать чек-лист Artifact-ами.","ts":1790152454309,"ws_id":52},{"id":"academy_dec_57","direction":"academy","done":false,"text":"[ПРИНЯТО] Общее ТЗ на исследование и валидацию спроса Eventer Academy (задача #251)\n\nПодготовлено и зафиксировано общее ТЗ, покрывающее всю задачу #251 целиком (не только CustDev): Блок 1 — актуальные вводные по трём продуктам; Блок 2 — CustDev (ТЗ уже было готово отдельно); Блок 3 — кабинетное исследование рынка/конкурентов/цен; Блок 4 — поведенческая валидация воронки (профориентация→заявка→консультация→бронь/оплата) через тестовый трафик на реальную CRM-воронку; Блок 5 — синтез выводов в единую таблицу и рекомендации по продукту/маркетингу/набору. Документ сохранён в Google Drive: \"Общее ТЗ — Исследование и валидация спроса Eventer Academy\".\n\nОбоснование: До этого существовало ТЗ только на CustDev-часть; остальные 5 пунктов чек-листа задачи #251 не имели своего рабочего документа. Кайрат подтвердил: \"да всё можно закрепить это зафиксировать в принципе всё устраивает\".","ts":1790233040172,"ws_id":57},{"id":"academy_dec_58","direction":"academy","done":false,"text":"[ПРИНЯТО] Коррекция инвестиционного тизера Eventer Academy: цена и объём Bootcamp\n\nПри сверке уже отправленного инвестору тизера (\"V3.0 Eventer Academy — Инвестиционный тизер\", Google Slides id 1sf2gWbTi-Lywv_J1z3qC72rf_MkzEjIy7uOZYyzSYvE) с тремя актуальными файлами бюджета (2026/2027/2028, папка Google Drive 1KekQhPFCJQXq-MbOCkiYWFC6UTT_aPXG) выявлено и подтверждено Кайратом:\n\n1. Цена Producer Bootcamp в тизере указана $5,500 — НЕВЕРНО. Подтверждённая верная цена — 2 500 000₸ (~$3,333 при курсе 750₸/$1, применяемом к Event Producer). Нужно исправить во всех местах тизера, где упоминается цена Bootcamp.\n\n2. После правки цены — пересчитать все производные итоговые цифры, зависящие от Bootcamp: финансовая сводка (слайд 11/12: выручка/расходы/прибыль 2027/2028/2029) и growth-model слайд.\n\n3. Обнаружено дополнительное расхождение по ОБЪЁМУ Bootcamp: в тизере указано 30 участников/квартал, в фактическом бюджете 2027 — 25/квартал (100/год). Верная цифра объёма пока не подтверждена Кайратом отдельно — требуется уточнение перед финальным пересчётом.\n\n4. Расхождение по составу продуктов (тизер показывает \"два продукта\" — Event Producer + Bootcamp, финмодели и устная презентация инвестору — три программы, включая Event Manager) признано Кайратом некритичным (\"не принципиально, даже лучше тизера\") — состав продуктов в тизере менять НЕ требуется, только исправить цену/объём Bootcamp.\n\n5. Источник истинных цифр для пересчёта — три файла бюджета из папки 1KekQhPFCJQXq-MbOCkiYWFC6UTT_aPXG, а не расчёты внутри самого тизера.\n\n6. После правок — построчная сверка итоговых цифр тизера с тремя файлами бюджета перед повторной отправкой инвестору.\n\nЗадача на исполнение: завтра Кайрат ставит ТЗ менеджеру (GPT), прочитать это решение и внести правки в тизер.\n\nОбоснование: Инвестор уже получил тизер с этими цифрами; предстоит подписание NDA и передача ссылки на финмодель — расхождение между тизером и реальными файлами бюджета должно быть устранено до этого момента, чтобы данные \"бились\" между документами.","ts":1790239405156,"ws_id":58},{"id":"academy_dec_59","direction":"academy","done":false,"text":"[ПРИНЯТО] V9.2 Маркетинговая стратегия Eventer Academy — план продаж Q4 2026 приведён к финмодели\n\nСоздан новый документ Google Drive \"01. V9.2 Маркетинговая стратегия Eventer Academy\" (id 1h897YOvTPZkzYyAl901wdtLxqGH8qikIUfS5CWjdDOk, та же папка, что и V9.1: parentId 1T6wplYAk_rO7s_AG05rdm7rgMpES8mH3). Это новая версия документа \"01. V9.1 Маркетинговая стратегия Eventer Academy\" (id 1grWiElWM4COdTe6RZRXCcZFR7teyhQAIOclE4pGt3ao) — старый документ отредактировать \"на месте\" через доступные инструменты не удалось, поэтому создана отдельная новая версия с новой ссылкой.\n\nИзменения в V9.2 relative к V9.1:\n1. П.12.1 (план продаж Q4 2026) приведён к цифрам финансовой модели: Event Manager 0/0/25 (37,5М₸), Event-продюсер 0/25/50 (56,25М₸), итого 93,75М₸ вместо прежних 146,25М₸.\n2. П.12.2 (потолок бюджета на привлечение) пересчитан по той же % от выручки логике: октябрь 0₸, ноябрь 3,75М₸, декабрь 18,75М₸, квартал 22,5М₸ вместо 36М₸. Добавлена сноска: октябрьская тестовая реклама (если есть) финансируется не из этой схемы самоокупаемости.\n3. Раздел 16 (дорожная карта), строка \"Октябрь\": формулировка \"Запуск первой группы Event Producer\" заменена на \"Техническая и рекламная подготовка, тестовые кампании без выделенного медиабюджета... Готовность к приёму оплат с ноября\" — чтобы не противоречить нулевой выручке октября по финмодели.\n4. В Приложение 1 (реестр решений) добавлена строка: финансовые модели \"Бюджет_академия_2026/2027/2028_с_налогами\" — центр истины по цифрам Академии, все остальные материалы приводятся в соответствие с ними (ПРИНЯТО).\n\nОткрытый вопрос (не решён Кайратом): что делать со старой версией V9.1 — оставить как архив, переместить в архивную папку или удалить, чтобы в рабочей папке не путались две версии.\n\nОбоснование: Правило \"финансовые модели 2026/2027/2028 — центр истины\" (см. предыдущее решение/контекст) требует, чтобы маркетинговая стратегия не противоречила фактическим цифрам, которые уже используются в переговорах с инвестором и в операционном планировании.","ts":1790241123048,"ws_id":59},{"id":"academy_dec_6","direction":"academy","done":false,"text":"[ПРИНЯТО] Архитектура сайта Eventer Academy и продуктовых лендингов\n\n1. Использовать одну главную страницу Eventer Academy как навигационный и имиджевый центр Академии.\n2. Создать три отдельных продуктовых лендинга: Event Producer, Event Manager и Producer Bootcamp.\n3. Главная страница Академии объясняет систему продуктов, различия между программами и помогает выбрать подходящий маршрут.\n4. Каждый продуктовый лендинг имеет самостоятельное позиционирование, целевую аудиторию, формат, программу, цену, календарь запуска и целевое действие.\n5. Не объединять три продукта в один длинный продающий лендинг.\n\nОбоснование: Продукты предназначены для разных аудиторий и имеют разные форматы. Раздельные лендинги позволят точнее раскрыть ценность и измерять конверсию каждого продукта, сохранив Eventer Academy единым брендом.","ts":1788166418527,"ws_id":6},{"id":"academy_dec_63","direction":"academy","done":false,"text":"[ПРИНЯТО] NDA подписан с ТОО «TMK Limited LLP» — направляем финансовую модель\n\nСоглашение о неразглашении конфиденциальной информации между ТОО «ALEM ENTERTAINMENT» (БИН 250140013451, Раскрывающая сторона, директор Кульбаева Л.С.) и ТОО «TMK Limited LLP» (БИН 210840005072, Принимающая сторона, директор Момынов Е.С.) подписано обеими сторонами 24.09.2026, действует с даты подписания. Следующий шаг — направить TMK Limited LLP ссылку на финансовую модель (Google Drive папка с материалами).\n\nОбоснование: NDA — необходимое условие для раскрытия финансовой модели потенциальному инвестору/партнёру; после подписания можно передавать материалы.","ts":1790251028707,"ws_id":63},{"id":"academy_dec_64","direction":"academy","done":false,"text":"[ПРИНЯТО] Финмодель Академии проверена и направлена TMK Limited LLP\n\nФинансовая модель Академии (бюджеты 2026, 2027, 2028 с налогами) полностью проверена построчно: выручка, расходы, реклама (10% от выручки), комиссия Halyk (18% от выручки Event-менеджера), НДС (порог 43 250 000₸ накопленным итогом, ставка 16% извлечена из цены с НДС), КПН (20% от накопленной налогооблагаемой прибыли) — все формулы и суммы по всем трём годам корректны и внутренне непротиворечивы.\n\nВ файле 2028 года на листе \"План-факт\" были найдены и исправлены 6 сломанных ячеек (#ERROR!/#NAME?/#VALUE!) в строках \"Итого затраты\" и \"Чистый операционный поток\", столбцы Сентябрь/Октябрь/Ноябрь (AB-AI): формулы потеряли букву столбца при ссылках на диапазоны (например, \\12:\\19 вместо AB12:AB19). Исправлено вручную в самом файле Кайратом по инструкции построчно, все ячейки подтверждены как чистые.\n\nСсылка на папку \"04.Фин модель академия\" (https://drive.google.com/drive/folders/1KekQhPFCJQXq-MbOCkiYWFC6UTT_aPXG) направлена ТОО «TMK Limited LLP» после подписания NDA от 24.09.2026 (см. Решение #63).\n\nОбоснование: Кайрат должен быть уверен, что данные, отправляемые внешней стороне (TMK) по NDA, корректны на 100% — проведён полный построчный аудит перед отправкой, а не только выборочная проверка. Расхождение с Инвестиционным тизером (Решение #58) и вопрос объёма Bootcamp остаются отдельными открытыми пунктами, не относящимися к самим файлам бюджета.","ts":1790253923570,"ws_id":64},{"id":"academy_dec_69","direction":"academy","done":false,"text":"[ПРИНЯТО] Анкета аттестации HISTES направлена в стартовом статусе\n\nАнкета аттестации HISTES отправлена в текущем стартовом виде. Поскольку Eventer Academy — стартап и первый поток планируется в ноябре 2026 года, разделы о фактических студентах, выпускниках и финансовых результатах заполнены соответствующим статусом. Дополнять сведения или предоставлять приложения — только при запросе HISTES.\n\nОбоснование: Подтверждено Кайратом 25.09.2026: «анкета уже в таком виде отправили; если у них будут вопросы — они зададут».","ts":1790320637552,"ws_id":69},{"id":"academy_dec_7","direction":"academy","done":false,"text":"[ПРИНЯТО] Ежемесячный календарь запуска когорт Event Producer\n\n1. Новая когорта Event Producer запускается ежемесячно.\n2. Базовый день старта — вторая среда каждого месяца.\n3. Если дата совпадает с государственным праздником или нерабочим днём, старт переносится на ближайшую подходящую рабочую среду.\n4. Стартовый календарь: когорта №1 — 14.10.2026, 25 студентов; когорта №2 — 11.11.2026, 35 студентов; когорта №3 — 09.12.2026, 50 студентов; когорта №4 — 13.01.2027; когорта №5 — 10.02.2027; когорта №6 — 10.03.2027.\n5. План набора когорт с января 2027 года утверждается отдельно.\n6. Продажи каждой когорты открываются ориентировочно за четыре недели до старта.\n\nОбоснование: Ежемесячный когортный запуск позволяет непрерывно набирать студентов, прогнозировать выручку и загрузку команды. Старт в среду удобен для учебного ритма и исключает попадание начала программы на выходные.","ts":1788168978233,"ws_id":7},{"id":"academy_dec_70","direction":"academy","done":false,"no":70,"text":"[ПРИНЯТО] Замена CustDev на поведенческий тест для Event Manager в задаче #251\n\nБлок 2 общего ТЗ по задаче #251 (CustDev-интервью) для направления Event Manager не проводится — интервью признаны слабым источником сигнала (риск социально одобряемых ответов на вопросы о готовности платить). Вместо интервью для Event Manager проводится прямой поведенческий тест: лендинг /program (уже существует, цена 1 500 000 ₸ открыто показана) + тестовый рекламный бюджет, замер реальных заявок и конверсии — по аналогии с уже идущим тестом воронки Event Producer. Для Event Producer CustDev также не требуется отдельно — там уже идёт реальная продажа с первой когортой 14.10.2026, что даёт более сильный сигнал, чем интервью. Параметры теста (бюджет, даты, площадки) — отдельное решение, не определены в рамках этого пункта.\n\nОбоснование: Кайрат оценил ценность плановых CustDev-интервью как низкую (\"мне кажется они ничего ценного нам не принесут\") и предпочёл прямой поведенческий сигнал вместо опроса мнений. Для Event Producer реальная воронка уже служит этим сигналом; для Event Manager, где реального теста ещё не было, нужен отдельный мини-тест лендинга и рекламы до полноценного запуска программы.","ts":1790856600000,"ws_id":70},{"id":"academy_dec_8","direction":"academy","done":false,"text":"[ПРИНЯТО] Масштабирование Event Producer и модель кураторской команды\n\n1. Когорты октября, ноября и декабря 2026 года являются этапом пилотного наращивания: 25, 35 и 50 студентов соответственно.\n2. С января по декабрь 2027 года базовый план — 130 студентов в каждой ежемесячной когорте. Ограничение 50 студентов из решения №005 не применяется к масштабному этапу с января 2027 года.\n3. При длительности программы около 13 недель с марта 2027 года одновременно обучаются около 390 студентов в трёх когортах.\n4. Кураторская команда формируется как постоянная общая команда программы, а не отдельный полный состав на каждую когорту.\n5. Один ведущий куратор руководит всей программой. Оплата — 500 000 ₸ в месяц.\n6. Норматив групповых кураторов — один куратор примерно на 40–45 активных студентов. Оплата группового куратора — 350 000 ₸ в месяц.\n7. Плановая численность: октябрь — ведущий куратор; ноябрь — ведущий и 1 групповой; декабрь — ведущий и 3 групповых; январь — ведущий и 5 групповых; февраль — ведущий и 8 групповых; с марта — ведущий и 9 групповых.\n8. Администратор LMS является отдельной ролью с оплатой 300 000 ₸ в месяц.\n9. На стабильном масштабе ежемесячный ФОТ кураторской команды и администратора LMS составляет 3 950 000 ₸.\n\nОбоснование: Ежемесячные когорты пересекаются во времени, поэтому расчёт отдельной полной команды на каждый поток создаёт дублирование. Общий ведущий куратор и масштабируемое число групповых кураторов позволяют поддерживать единое качество программы и управляемую нагрузку.","ts":1788169785691,"ws_id":8},{"id":"academy_dec_9","direction":"academy","done":false,"text":"[ПРИНЯТО] Архитектура автопродаж и онбординга Event Producer\n\n1. Продажи Event Producer строятся преимущественно как автоматизированная воронка без обязательного участия живого менеджера в каждой сделке.\n2. Целевой показатель: 70–80% студентов совершают осознанную самостоятельную покупку; 20–30% используют консультацию живого менеджера. Базовый расчёт финансовой модели — 25% обращений к менеджеру.\n3. Креатив и лендинг должны полностью раскрывать продукт: целевую аудиторию, профессиональный результат, содержание, формат, нагрузку, экспертов, практику, оценивание, цену, рассрочку, даты, договор, возврат и ответы на возражения.\n4. Оффер должен быть чистым и понятным, чтобы покупатель принимал осознанное решение без обязательного звонка.\n5. Для отдельных кандидатов сохраняется возможность заказать звонок живого менеджера.\n6. После оплаты действует обязательный онбординг: подтверждение оплаты и договор, доступ в LMS, календарь, входная диагностика, инструкция по платформе, знакомство с куратором и группой и техническая проверка.\n7. На масштабе 130 студентов предусматривается один менеджер, если доля ручных консультаций не превышает 20–30%. Второй менеджер добавляется только при превышении нагрузки или ухудшении скорости ответа.\n8. Рабочий бюджет продаж, CRM и автоматизации — около 1 000 000 ₸ в месяц.\n\nОбоснование: Масштабирование на русскоязычную аудиторию требует продающей системы, которая не зависит от пропорционального роста отдела продаж. Полное раскрытие продукта до покупки снижает сомнения, повышает осознанность выбора и позволяет менеджеру работать только со сложными случаями.","ts":1788170324337,"ws_id":9},{"id":"afisha_dec_24","direction":"afisha","done":false,"text":"[ПРИНЯТО] Запуск поиска разработчиков и утверждение сценария входа через Reels → чат → кастомная витрина\n\nПосле разговора с Михаилом Afisha.kz начинает поиск разработчиков по четырём направлениям: back-end/«пылесос», рекомендации, front-end, контент-фабрика. Утверждена продуктовая логика входа: Reels по настроению Night Life → чат с онбордингом по интересу → кастомная витрина. Базовая идея: пользователь видит персонализированный, эмоционально сильный контент по своим интересам без необходимости искать или формулировать запрос.\n\nОбоснование: Закрепить командную структуру разработки и единый пользовательский сценарий Afisha.kz (feed-first, interest-based experience).","ts":1788785254819,"ws_id":24},{"id":"afisha_dec_25","direction":"afisha","done":false,"text":"[ПРИНЯТО] Принцип Night Life-витрины: персональная лента с доминирующим сценарием и смежными форматами pre-party / after-party\n\nПосле входа через Night Life Reels и чат-онбординг пользователь должен попадать на персональную кастомную витрину, а не на жёсткую статичную страницу Night Life. Night Life — основной эмоциональный якорь, но внутри витрины допускаются смежные сценарии: pre-party и after-party форматы, если они соответствуют интересу пользователя и контексту.\n\nОбоснование: Зафиксировать продуктовый принцип: Afisha.kz строит mood-based personalized feed, а не отправляет пользователя в узкую категорийную страницу.","ts":1788788514557,"ws_id":25},{"id":"afisha_dec_34","direction":"afisha","done":false,"text":"[ПРИНЯТО] Добавление в MVP-план Afisha.kz двух контуров: система сбора событий и логика блока «Вечер за X тенге»\n\nВ структуру планирования MVP Afisha.kz включаются два контура: 1) проектирование системы сбора и хранения событий — как парсер собирает мероприятия, как данные нормализуются и как приложение/витрина/ассистент забирают нужные сущности из базы; 2) проектирование рекомендательной логики для блока «Вечер за X тенге» — какие сценарии ассистент предлагает по заданному бюджету, правила формирования подборки, ограничения.\n\nОбоснование: Зафиксировать, что MVP Afisha.kz требует не только витринного и UX-проектирования, но и отдельной проработки data-layer и бюджетных рекомендаций.","ts":1789028390852,"ws_id":34},{"id":"afisha_dec_35","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утверждение родительских задач первого уровня для MVP Afisha.kz\n\nДля подготовки и запуска MVP Afisha.kz утверждается последовательный набор родительских задач первого уровня: 1) зафиксировать рамку MVP и продуктовую магию; 2) спроектировать логику главной витрины и персонализации; 3) спроектировать заботливую карточку события и места; 4) спроектировать систему сбора, нормализации и хранения событий; 5) спроектировать рекомендательную логику «Вечер за X тенге»; 6) сформировать контентную модель и принципы наполнения витрины; 7) сформировать план реализации MVP и критерии контроля качества.\n\nОбоснование: Зафиксировать согласованный верхнеуровневый план работ по MVP Afisha.kz до детализации в подзадачи и чек-листы.","ts":1789029107836,"ws_id":35},{"id":"afisha_dec_36","direction":"afisha","done":false,"text":"[ПРИНЯТО] Принцип Instagram Afisha.kz: не типовой lifestyle-аккаунт, а продуктовый вход в персональные сценарии\n\nInstagram Afisha.kz не должен развиваться как типовой городской lifestyle-аккаунт или простая лента афиш. Его роль — быть внешним discovery-каналом и продуктовым входом в Afisha.kz, квалифицируя интерес пользователя и переводя его в релевантный сценарий: подборку, карточку события, карточку места, персональную витрину или сценарий вечера.\n\nОбоснование: Зафиксировать, что Instagram Afisha.kz должен выполнять продуктовую функцию воронки и персонализации, а не дублировать формат городских lifestyle-медиа.","ts":1789097183898,"ws_id":36},{"id":"afisha_dec_55","direction":"afisha","done":false,"text":"[ПРИНЯТО] SEO-канал роста: ИИ-обогащение контента поверх тем, уже приносящих трафик конкурентам\n\nРазвивать SEO как отдельный канал органического роста Afisha.kz. Механика: взять темы/статьи, уже приносящие трафик конкурентам (в первую очередь Sxodim, ~90,000 визитов/мес), и сделать версии заметно качественнее с реальным обогащением — данные из живой базы Afisha (даты/цены/места). Разделение ролей: Михаил готовит ТЗ по ключевым словам и структуре; тексты по ТЗ генерирует ИИ-ассистент.\n\nОбоснование: Кабинетное исследование (SimilarWeb) подтвердило: органический поиск — 60.51% трафика Sxodim, доказанный работающий канал. У Afisha структурно больше поверхности для таких запросов благодаря 10 категориям.","ts":1790228607647,"ws_id":55},{"id":"afisha_dec_56","direction":"afisha","done":false,"text":"[ПРИНЯТО] Структура справочника Performer и логика извлечения парсером\n\nДобавить в базу данных Afisha справочник Performer. Поля: имя/название, тип/роль, алиасы (для дедупликации), связь с событиями many-to-many. Применить двухуровневую логику заботы: массовый автоматический слой (имя + роль, извлечённые парсером) и опциональный курируемый слой (био, фото, соцсети). Логика извлечения парсером — два прохода: (1) из названия события по паттернам; (2) если в названии перформера нет — поиск в описании по ролевым ключевым словам.\n\nОбоснование: Продолжение декомпозиции сущностей базы данных для более точного и структурированного парсинга событий.","ts":1790230969768,"ws_id":56},{"id":"afisha_dec_60","direction":"afisha","done":false,"text":"[ПРИНЯТО] Afisha: целевые параметры модели монетизации — 800 000 MAU, частота раз в неделю\n\nУтверждены рабочие параметры для модели монетизации Afisha.kz: охват — 800 000 уникальных пользователей в месяц; частота использования — раз в неделю на пользователя (~4 сеанса/месяц). Приняты как рабочая точка отсчёта для дальнейшего расчёта воронки монетизации, а не как окончательно подтверждённые исследованием показатели.\n\nОбоснование: Между 500К (осторожный старт) и 1М (по аналогии с Тикетон/Kino.kz) выбрана средняя точка 800К. Частота раз в неделю подтверждена бенчмарком UxCam.","ts":1790242476020,"ws_id":60},{"id":"afisha_dec_61","direction":"afisha","done":false,"text":"[ПРИНЯТО] Afisha: целевой ARPU $15/год на уникального пользователя (800K MAU)\n\nРабочий параметр монетизационной модели Afisha.kz: целевой ARPU = $15/год на уникального пользователя при базе 800 000 MAU. Итого целевая выручка = $12 млн/год. Модель монетизации — транзакционная комиссия с поставщиков за бронирования/покупки через Afisha: билеты 7-10%, рестораны 10-15%, активности/квесты 15-20%+.\n\nОбоснование: $15/год почти точно совпадает с исторической внутренней гипотезой Afisha из питч-дека ($1,2/мес × 12 = $14,4/год на 2,2 млн MAU). Требует проверки исследованием.","ts":1790244540851,"ws_id":61},{"id":"afisha_dec_62","direction":"afisha","done":false,"text":"[ПРИНЯТО] Afisha: две параллельные гипотезы монетизации для проверки исследованием — массовая (800К) и премиальная (150-200К)\n\nВместо единственной модели монетизации закладываем ДВЕ параллельные гипотезы с одной и той же целевой выручкой $12М/год:\nГИПОТЕЗА А — Массовая: 800 000 MAU × $15/год ARPU = $12М/год. Декомпозиция: транзакционная комиссия ~85%, B2C подписка ~10%, B2B-инструменты ~4%, геймификация ~1%.\nГИПОТЕЗА Б — Премиальная: 150 000-200 000 MAU × $60-80/год ARPU = $12М/год. Декомпозиция (на $80): транзакционная комиссия ~70%, B2C подписка/членство ~25%, B2B ~4%, геймификация ~1%. Позиционирование: не закрытый клуб, база универсальная, премиальность в слое AI-курации и подачи.\nОбе гипотезы используют один и тот же принцип атрибуции комиссии (Context #33) и логику дифференцированной комиссии по категориям.\n\nОбоснование: Комиссионная B2B-модель требует объёма, а premium/узкая аудитория этот объём снижает. Разрешение — сформулировать обе гипотезы чётко и проверить исследованием.","ts":1790249039820,"ws_id":62},{"id":"afisha_dec_71","direction":"afisha","done":false,"text":"[ПРИНЯТО] Afisha: цель 1М MAU через банковское партнёрство как главный канал роста, плюс контент-фабрика и геймификация «Настоящий Алматинец»\n\n1. Целевой MAU пересматривается с 800К на 1 000 000 по всей стране. 2. Главный канал роста — партнёрство с банком (рабочая гипотеза: Forte Bank, объединённая база с Homecredit ~3М клиентов): банк направляет клиентов в Afisha, в обмен Afisha даёт cashback, рассрочку на билеты/брони, спонсорские интеграции. 3. Параллельные каналы: контент-фабрика (200-300 Reels/мес), SEO/Google News, рекламная кампания на медиабордах «25 лет Afisha». 4. Позиционирование «для людей с высокой культурой и эстетикой» — статусная планка, не сужает охват. 5. Геймификация «Настоящий Алматинец»: викторины на знание города, баллы, медали, титулы, привилегии от партнёров — зависит от базы организаторов. 6. Прежде чем направлять банковских клиентов, база данных и продукт должны реально работать.\n\nОбоснование: Банковское партнёрство даёт более сильную стратегию роста, чем чистая органика. Геймификация снимает противоречие между премиальным позиционированием и массовым охватом, даёт механику повторного использования приложения.","ts":1790417461554,"ws_id":71},{"id":"afisha_dec_72","direction":"afisha","done":false,"text":"[ПРИНЯТО] Зафиксировать цель монетизации: 1 млн пользователей по Казахстану × $15\n\nЦелевой ориентир модели монетизации Afisha.kz: 1 млн пользователей в год по всему Казахстану, доход ~$15 на пользователя в год, итого ~$15 млн выручки в год.\n\nОбоснование: 1 млн пользователей для одного Алматы нереалистичен; база расчёта — весь Казахстан.","ts":1790470776440,"ws_id":72},{"id":"afisha_dec_73","direction":"afisha","done":false,"text":"[ПРИНЯТО] Зафиксировать: $15 на пользователя — B2C-доход с его покупок\n\n$15 в год на пользователя — это B2C-доход Afisha.kz с покупок самого пользователя. B2B (площадки, бренды) и банковские доходы считаются отдельно, поверх этой цифры.\n\nОбоснование: Уточнение к решению №72: модель строится от покупок пользователя.","ts":1790470823779,"ws_id":73},{"id":"afisha_dec_74","direction":"afisha","done":false,"text":"[ПРИНЯТО] Зафиксировать 10 категорий досуга как единый справочник Afisha.kz\n\nДействующий справочник категорий досуга Afisha.kz — 10 категорий: 1. Культура 2. Развлечения 3. Спорт 4. Активный отдых 5. Экскурсии и путешествия 6. Развитие и мастер-классы 7. Велнес 8. Рестораны и клубы 9. Детям 10. Занимательный шопинг. Городской/праздничный характер — тег, а не категория.\n\nОбоснование: В Afisha Data Base уже действует справочник из 10 категорий, а документы на Drive ещё описывают 6–7 категорий. Нужна единая точка правды.","ts":1790472139444,"ws_id":74},{"id":"afisha_dec_75","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утвердить методологию расчёта рынка досуга по 10 категориям (TAM/SAM/SOM)\n\nРынок досуга Afisha.kz считается по 10 категориям (решение №74) по международным методологиям с триангуляцией спроса и предложения: предложение — объём услуг БНС по кодам ОКЭД (гармонизирован с ISIC/NACE); спрос — расходы домохозяйств по COICOP 2018. Где статистики нет — расчёт снизу вверх: число мест × средний чек × частота. Результат по каждой категории: TAM (Казахстан) → SAM (города присутствия) → SOM (реалистичная доля Afisha) → вклад в $15 B2C-дохода на пользователя (решения №72, №73).\n\nОбоснование: Разные источники дают несопоставимые цифры. Единая методология на мировых стандартах делает расчёт проверяемым и защитимым перед банками и инвесторами. Основа для исследования №258.","ts":1790472555975,"ws_id":75},{"id":"afisha_dec_76","direction":"afisha","done":false,"text":"[ПРИНЯТО] Расширить справочник до 14 категорий досуга\n\nСправочник категорий досуга расширяется с 10 до 14 категорий (дополнение к решению №74): 1. Культура 2. Развлечения 3. Спорт 4. Активный отдых 5. Экскурсии и путешествия 6. Развитие и мастер-классы 7. Велнес 8. Рестораны и клубы 9. Детям 10. Занимательный шопинг 11. Сообщества и нетворкинг (НОВАЯ) 12. Загородный отдых (НОВАЯ) 13. Частные праздники (НОВАЯ) 14. Досуг дома (НОВАЯ). Осознанно исключены: азартные игры и казино.\n\nОбоснование: Сверка с COICOP и витринами Fever, Eventbrite, Time Out показала пробелы: сообщества, отдых рядом с домом, частные праздники и домашний досуг не укладывались в 10 категорий. Азартные игры противоречат элитарному позиционированию Афиши.","ts":1790478042204,"ws_id":76},{"id":"afisha_dec_77","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утвердить семь столпов стратегии Afisha.kz\n\nСтратегия Afisha.kz строится на семи столпах:\n1. Бронирование и консьерж-отдел — автоматическая бронь, где возможно, и ручная там, где нет. Главный источник транзакционного дохода.\n2. Центр привлечения — подборки по настроению и по логике (на двоих, для семьи, на выходные, сегодня, на неделе). Каждая подборка = ТЗ для контент-фабрики на 200–300 вирусных Reels в месяц. Лозунг: «Мы знаем город лучше, чем город знает сам себя».\n3. Широчайшая база данных — лозунг: «Если событие существует, оно есть в Афише».\n4. Забота — заботливая карточка события и места.\n5. Эстетика.\n6. Культурная элитарность.\n7. Журнал — серьёзные статьи, культурная критика, обзоры, lifestyle, рестораны, аналитика рынка досуга.\n\nОбоснование: Конкуренты (Тикетон, Kino.kz, Яндекс Афиша, Sxodim) продают билет. Афиша выигрывает на выборе и организации досуга целиком: подборки, бронь под ключ, полнота базы и качество подачи.","ts":1790478046562,"ws_id":77},{"id":"afisha_dec_78","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утвердить названия новых категорий: «Клубы по интересам», «Досуг дома»\n\nУточнение к решению №76 — итоговые названия новых категорий:\n11. «Клубы по интересам» (вместо «Сообщества и нетворкинг») — клубы по интересам, беговые и книжные клубы, встречи, знакомства, митапы, форумы; только публичные события с открытым входом.\n12. «Загородный отдых» — без изменений. «Вокруг Алматы» остаётся настроением на витрине.\n13. «Частные праздники» — без изменений.\n14. «Досуг дома» — название сохраняется.\n\nОбоснование: Названия категорий должны звучать по-русски естественно, без калек с английского.","ts":1790478219974,"ws_id":78},{"id":"afisha_dec_79","direction":"afisha","done":false,"text":"[ПРИНЯТО] Ввести кластеры интересов и запустить пилотный кластер «Теннис и падел»\n\n1. Вводится новый слой базы Afisha — «кластеры интересов». Кластер собирает всё, что связано с одним увлечением, поперёк категорий: места, специалисты (тренеры, гиды, инструкторы — performers), события, магазины и прокат снаряжения, клубы, материалы журнала, бронирование. Кластер — отдельный справочник-тег поверх 14 категорий, а не новая категория. В справочник мест добавляются типы «магазин снаряжения» и «прокат».\n2. Пилотный кластер — «Теннис и падел» (Алматы): корты, падел-площадки, школы, тренеры, магазины, клубы, турниры, свободные слоты кортов.\n3. Следующие кластеры: горные лыжи и сноуборд, коньки, велоспорт, бег и марафоны, гольф, единоборства, йога и ретриты, рыбалка, охота, бёрдвотчинг, походы и горы, домашние животные.\n4. Домашние животные — досуг и хобби: выставки собак, кошек, аквариумных рыб, птиц, клубы владельцев, дрессировка. Плюс фильтр «можно с питомцем» для мест и событий.\n5. Категория 11 переименовывается в «Клубы по интересам и хобби» (уточнение к решению №78).\n\nОбоснование: ЗОЖ и хобби растут, но информация по каждому увлечению разбросана, единого ресурса нет. Кластер делает Афишу лучшим ресурсом по увлечению и даёт вход для бронирования специалистов и площадок.","ts":1790479302984,"ws_id":79},{"id":"afisha_dec_80","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утвердить конвейер «Робот собирает → AI проверяет → человек разбирает исключения», метку настроения и структурную цену\n\nКонвейер обработки данных Afisha Data Base:\n1. Робот (парсер) собирает кандидата: факты из источника (название, дата, время, место, исполнитель, цена) и разметку по правилам — категория, тип, настроение (1–3, одно главное), кластер, «для кого» (на двоих, семья, друзья, один).\n2. AI проверяет каждого кандидата перед переводом в событие: полнота и корректность фактов, дубли по смыслу, верность разметки робота, фейки/реклама/отмены/непубличные мероприятия. Решение: принять / исправить и принять / отправить человеку.\n3. Человек разбирает только исключения, отмеченные AI, и проверяет события для витрины.\n4. Обратная связь: если AI систематически исправляет одно правило робота — правило меняется.\nСправочник настроений (коды стабильные, названия для витрины можно менять): Музыка, Мегаполис, Адренали
