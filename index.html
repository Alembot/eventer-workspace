н, Feel good, Друзья, Wellness, Night Life, Культура, Семья, Handmade, Luxe, Романтика, ГурмЭ, Шопинг.\nЦена хранится структурно: цена от–до, бесплатно, тип цены (билет, вход, депозит, средний чек, по регистрации), на человека / на стол, что входит, дата проверки. Для мест — средний чек на человека.\n\nОбоснование: Робот по правилам — быстро, дёшево и предсказуемо; AI как контролёр качества закрывает смысловые случаи и ошибки; человек не тратит время на рутину. Настроение и структурная цена нужны для витрины и «Вечера за Х тенге».","ts":1790558083640,"ws_id":80},{"id":"afisha_dec_81","direction":"afisha","done":false,"text":"[ПРИНЯТО] Разделить «Рестораны и клубы», сократить настроения до 13, вынести «С друзьями» и «Семью» в поле «Для кого»\n\nУточнения к справочникам Afisha Data Base (к решениям №76, №80):\n1. Категория «Рестораны и клубы» делится на две: «Рестораны и кафе» (гастрономия, кофейни, бранчи, ресторанные события; ОКЭД 56.10) и «Бары и ночная жизнь» (бары, клубы, вечеринки, караоке; ОКЭД 56.30). Категорий становится 15.\n2. Правило «Культура / Развлечения»: категорию определяет программа, а не исполнитель и не площадка. Академическое искусство (классическая музыка, опера, балет, театр) → Культура; симфонические каверы на кино- и поп-музыку, шоу формата Candlelight → Развлечения.\n3. Код настроения «Мегаполис» — MEGAPOLIS.\n4. «С друзьями» и «В кругу семьи» убираются из настроений: это не эмоция, а компания. Они задаются полем «Для кого» (Один / На двоих / С друзьями / С семьёй); блоки витрины «С друзьями» и «В кругу семьи» собираются по этому полю. «Романтика» остаётся настроением (атмосфера). Настроений становится 13: Мелодии и ритмы, Мегаполис, Адреналин, Feel good, Wellness, Огни ночного города, Культурный код, Сделай сам, Luxe, Романтика, ГурмЭ, Вокруг Алматы, Шопинг.\n5. Концепция «Мегаполиса»: главный герой — сам город (истории, легенды, мистика, архитектура, скрытые места). Подборки: «Тайны и легенды Алматы», «Истории, которые знают не все», «Город глазами знатоков», «Настоящий алматинец». «Тайный вечер» удаляется.\n\nОбоснование: Рестораны и бары — разные поводы, время и аудитория. Настроение должно отвечать на вопрос «какую эмоцию я хочу», а «Для кого» — «с кем я иду»; смешение давало дубли. Название «Городские расследования» вызывало криминальные ассоциации.","ts":1790559798982,"ws_id":81},{"id":"afisha_dec_82","direction":"afisha","done":false,"text":"[ПРИНЯТО] Утвердить новый интерфейс Afisha Data Base по мокапу и передать в разработку\n\nУтверждён новый интерфейс Afisha Data Base по кликабельному мокапу (https://claude.ai/artifact/9Q8c6fwrKEXz7QTrQy6cCJ): единое левое меню (Главная; Реестры: События, Места, Организаторы, Перформеры; Работа: Конвейер проверки, Сбор данных; Знания: Справочники, Инструкции); Главная — дашборд; экраны реестров устроены как «цифры сверху + реестр снизу»; реестр событий сортируется от ближайших к поздним, архив отдельно; экран категории показывает места и только актуальные события; карточки события и места по структуре сущностей. ТЗ на реализацию передаётся PM Afisha.kz.\n\nОбоснование: Текущий интерфейс базы не показывает логику данных: категории перегружены, нет стадий проверки, нет справочников и инструкций внутри системы.","ts":1790571299444,"ws_id":82}],"context":[{"id":"academy_ctx_1","direction":"academy","done":false,"text":"Event-менеджер  статус\n\nЗдесь пояснительное записка статуса актуальных обсуждений по разработке продукта Event-менеджер   с GPT","ts":1787839200000,"ws_id":1},{"id":"academy_ctx_10","direction":"academy","done":false,"text":"Дефект отображения чек-листов в подзадачах CRM №200–204\n\nПоручение Кайрата. Проверена родительская CRM-задача №128 «Проверить готовность CRM Eventer.kz» и подзадачи №200–204. В базе в каждой из пяти подзадач уже сохранено по 5 утверждённых пунктов чек-листа. Проблема относится не к отсутствию данных и не к постановке задач, а к отображению в интерфейсе Workspace: при открытии подзадач №200, №201, №202, №203 и №204 Кайрат не видит сохранённые пункты чек-листа. Для Главного менеджера зафиксирован дефект: в интерфейсе Eventer Academy при открытии каждой из подзадач №200–204 должны сразу отображаться её 5 пунктов чек-листа. До исправления повторно добавлять эти пункты не нужно, чтобы не создавать дубли и не перезаписывать существующие данные.","ts":1788861209656,"ws_id":10},{"id":"academy_ctx_17","direction":"academy","done":false,"text":"Целевая аудитория и позиция Eventer Academy\n\n# Целевая аудитория и позиция Eventer Academy\n\n## Статус\n\nПРИНЯТО как рабочий контекст для исследования, маркетинга, продаж и развития продуктов Академии. Количественные оценки, не подтверждённые исследованиями и официальной статистикой, считаются рабочими гипотезами.\n\n## 1. Какую роль должна играть Академия\n\nEventer Academy создаётся не как очередной курс по организации праздников. Это профессиональная образовательная среда для людей, которые хотят войти в индустрию событий, вырасти от исполнителя к менеджеру и продюсеру, управлять проектами или создавать собственные события.\n\nАкадемия соединяет:\n\n- системное профессиональное мышление;\n- знания и личные кейсы действующих экспертов;\n- практику и работу с реальными задачами;\n- карьерную навигацию;\n- знакомство с профессиональной средой и alumni-сообществом.\n\nМы предлагаем деликатную прикладную альтернативу традиционной траектории высшего образования — не противопоставляя себя вузам. Для части людей важнее не получить ещё один формальный диплом, а за разумный срок войти в профессию, понять систему работы, получить практику и профессиональные связи.\n\nАкадемия не обещает лёгкую карьеру. Она даёт знания, среду, практику и доступ к индустрии. Дальнейший результат зависит от мотивации, дисциплины и работы самого студента.\n\n## 2. Какое отношение к профессии мы хотим изменить\n\nЗадача Академии — изменить упрощённое представление об организаторе как о «человеке в бабочке с микрофоном».\n\nСовременный event-специалист управляет проектом, бюджетом, командой, подрядчиками, площадкой, сроками, безопасностью, коммуникациями и итоговым результатом для заказчика. Это серьёзная управленческая профессия на стыке креатива, бизнеса, технологий, культуры и коммуникаций.\n\nКарьерные траектории шире event-агентства. Выпускник может расти:\n\n- в концертной и шоу-индустрии;\n- в корпоративном маркетинге, брендинге, PR и внутренних коммуникациях;\n- в MICE, гостиничном, ресторанном и туристическом бизнесе;\n- на стороне площадок, продакшена, rental, декора, кейтеринга;\n- в спорте, культуре, городских и государственных проектах;\n- в протоколе, международных отношениях и крупных общественных инициативах;\n- в собственном агентстве, фестивале, шоу-проекте или другом бизнесе.\n\nПрофессия даёт возможность управлять большими проектами, развивать нетворк, создавать собственные инициативы и расти в доходе.\n\n## 3. Основные сегменты аудитории\n\n### Школьники, выпускники колледжей и родители\n\nЭто ключевой сегмент для программы Event Manager в Казахстане.\n\nВ фокусе:\n\n- выпускники 11 классов;\n- выпускники колледжей;\n- выпускники и студенты вузов, которые ищут прикладную профессиональную траекторию;\n- родители, которые принимают или существенно влияют на решение об обучении.\n\nДля этой аудитории важны не только программа и цена. Им нужно понять, что это за профессия, кем сможет работать выпускник, как строится карьера, на чём можно зарабатывать и насколько обучение даёт реальный старт.\n\nПодтверждённые ориентиры для Казахстана: 184 022 выпускника 11 классов в 2024/25 учебном году и 169,3 тыс. выпускников ТиПО в 2025 году. Численность выпускников вузов должна быть отдельно подтверждена официальной статистикой. Данные нельзя механически складывать с выпускниками 9 классов, чтобы не допустить двойного счёта.\n\n### Новички и люди, меняющие профессию\n\nЭто молодые специалисты и взрослые, которым интересна индустрия событий, но у них нет системного опыта. Им нужен мягкий вход: понятный маршрут, реальные задачи, практика и первые профессиональные контакты.\n\nДля них Event Manager — не «быстрый курс», а старт в профессии с пониманием стандартов и ответственности. Программа проводится офлайн в Алматы и длится шесть месяцев.\n\n### Действующие event-специалисты\n\nЭто координаторы, ассистенты, event-менеджеры, фрилансеры и сотрудники агентств. Они уже умеют выполнять отдельные задачи, но хотят выйти за пределы своей функции: управлять событием, бюджетом, командой и результатом целиком, а также создавать собственные проекты.\n\nДля них предназначен Event Producer: русскоязычная онлайн-программа продолжительностью 13 недель, включающая 11 модулей и 56 уроков.\n\n### Специалисты смежных профессий\n\nЭто отдельный, а не второстепенный сегмент. В него входят:\n\n- маркетологи, PR- и бренд-менеджеры;\n- HR-специалисты и команды внутренних коммуникаций;\n- сотрудники площадок, отелей, ресторанов и банкетных комплексов;\n- специалисты продакшена, rental, декора, кейтеринга;\n- сотрудники концертных, спортивных, культурных и туристических проектов;\n- представители городских, государственных и протокольных структур.\n\nОни уже регулярно работают с событиями. Академия может помочь им повысить уровень текущей работы или перейти к управлению событиями как отдельной профессии.\n\n### Опытные руководители, продюсеры и владельцы бизнеса\n\nЭто руководители проектов, продюсеры, владельцы агентств и опытные фрилансеры, которым нужен новый масштаб: более крупные проекты, лидерство, международные и государственные события, развитие собственного бизнеса, создание фестиваля, шоу или другого самостоятельного проекта.\n\nДля них предназначен Producer Bootcamp — отборочная лидерская программа в крупных мегаполисах. Её ценность не в базовых знаниях, а в концентрации опыта, личном общении с сильными экспертами и профессиональном окружении.\n\n### Русскоязычная международная аудитория\n\nДля Event Producer и Producer Bootcamp рынок не ограничивается Казахстаном или СНГ. В него входят русскоязычные специалисты, работающие или живущие в Европе, США, Израиле, странах Кавказа, Центральной Азии и других регионах.\n\nИх следует сегментировать не по стране происхождения, а по трём признакам: язык, связь с индустрией и готовность инвестировать в профессиональное развитие.\n\nДля Event Manager на первом этапе приоритет — Казахстан и физический учебный центр в Алматы.\n\n## 4. Оценка рынка\n\nОценка, что в индустрию событий на территории СНГ вовлечено более 2 500 000 человек, — РАБОЧАЯ ГИПОТЕЗА, а не установленный факт.\n\nЕё логика состоит в том, что индустрия — это не только event-агентства. В неё также входят заказчики и корпоративные команды, площадки, продакшен, rental, декор, кейтеринг, артисты и концертные команды, отели, рестораны, MICE, спорт, культура, государственные и протокольные структуры.\n\nГипотезу необходимо проверить через:\n\n- международные отраслевые исследования;\n- официальную статистику стран;\n- оценку каждого сегмента снизу вверх;\n- проверку платёжеспособного спроса и конверсии в когорты.\n\nИсследования Oxford Economics и EIC могут быть полезным ориентиром по деловым событиям, но их нельзя механически переносить на весь рынок: они не охватывают полностью концерты, шоу, свадьбы, социальные и политические события.\n\n## 5. Профцентр и работа с родителями\n\nПРИНЯТО как направление развития: центр профориентации при физическом образовательном центре Академии.\n\nРодители и школьники смогут прийти на консультацию, чтобы понять:\n\n- содержание профессии;\n- карьерные траектории;\n- компетенции и уровень ответственности;\n- возможные модели дохода;\n- формат обучения и первые шаги в индустрии.\n\nРабочие форматы:\n\n- встречи основателя с группами родителей по 30–50 человек;\n- индивидуальные профориентационные консультации;\n- открытые дни и экскурсии в образовательный центр;\n- лекции Кайрата и коллег в университетах и колледжах;\n- контент с реальными кейсами экспертов и выпускников.\n\nЗадача — помочь семье принять осознанное решение, а не дожимать человека в продажу.\n\n## 6. Принцип привлечения и продаж\n\nПозиция Академии: не использовать агрессивные инфобизнесовые техники и не брать деньги у человека, который не готов к обучению.\n\nЕсли человек хочет научиться организовывать события, Академия даёт систему, практику и знакомство с индустрией. Дальше результат зависит от его личной работы.\n\nПри этом осознанность не означает пассивные продажи. Нужны понятный сайт, консультация по запросу, быстрая помощь с выбором программы и бережное сопровождение человека, который уже проявил интерес.\n\nРАБОЧАЯ ГИПОТЕЗА: часть аудитории сможет принять решение онлайн при подробном описании программы, прозрачной цене и консультации по запросу. Часть высокочековых сделок потребует живого разговора с менеджером. Это нужно проверять на фактических данных запуска, а не решать заранее идеологически.\n\n## 7. Как проверяем спрос\n\n### Исследование рынка\n\nНужно определить размер и структуру сегментов, конкурентные программы, диапазоны цен, платёжеспособность и доступные каналы выхода на аудиторию.\n\n### Детальный конкурентный анализ\n\nОтдельная сравнительная таблица по Казахстану, Москве, России, СНГ и русскоязычным международным программам. Для каждой программы фиксируются только подтверждённые первоисточниками данные:\n\n- цена и рассрочка;\n- формат;\n- длительность;\n- число модулей, уроков и часов;\n- практика;\n- эксперты;\n- документ об обучении;\n- целевая аудитория;\n- ссылка на источник.\n\n### Глубинные интервью и CustDev\n\nПровести 20–30 интервью с представителями сегментов: школьники и родители, новички, действующие event-специалисты, смежники, руководители и владельцы бизнеса.\n\nВопросы должны быть о прошлом опыте и фактическом поведении: как человек выбирал обучение, сколько платил, почему не купил, что для него стало риском, какие компетенции нужны ему сейчас. Вопрос «купили бы вы программу?» не является достаточным подтверждением спроса.\n\n### Проверка поведением\n\nГлавные сигналы — не ответы респондента, а реальные действия:\n\n- переход на лендинг;\n- заявка;\n- запись на профориентационную встречу или лекцию;\n- консультация;\n- внесение депозита или предзаказ;\n- оплата.\n\nНужно измерять стоимость перехода и лида, конверсию в консультацию, заявку и оплату, а также причины паузы или отказа по каждому сегменту и продукту.\n\n## 8. Продуктовые границы\n\n**Event Manager** — Казахстан, офлайн, шесть месяцев. Фокус: школьники, выпускники колледжей, родители, новички и люди, меняющие профессию. Цена для студента — 1 500 000 ₸ с рассрочкой; стоимость банковской рассрочки Академия берёт на себя.\n\n**Event Producer** — русскоязычная онлайн-программа для действующих специалистов и смежников из СНГ и международного русскоязычного контура. Продолжительность — 13 недель, 11 модулей и 56 уроков. Цена — 750 000 ₸ без рассрочки.\n\n**Producer Bootcamp** — очная отборочная лидерская программа для опытных специалистов, проводимая в крупных мегаполисах. Продолжительность — три дня. Цена — 2 500 000 ₸ без рассрочки. Страна и даты определяются отдельно.\n\n## Следующий шаг\n\nНа основе этого контекста подготовить исследовательскую карту: сегменты, гипотезы, источники, вопросы интервью, каналы выхода и критерии подтверждения спроса. До завершения исследования оценки рынка и прогнозные конверсии не считать утверждёнными.","ts":1790066880000,"ws_id":17},{"id":"academy_ctx_4","direction":"academy","done":false,"text":"Текущий статус подготовки и запуска Event Manager\n\nEvent Manager — очный шестимесячный продукт с девятью модулями. Первые четыре месяца: очные занятия Пн/Ср/Пт 09:00–14:00 и обязательные домашние дни Вт/Чт 09:00–12:00; всего 320 часов. Затем два месяца стажировок, дипломного проекта, защиты и карьерного сопровождения. Контроль домашних дней: LMS → первичная проверка ИИ-ассистентом → учебный ассистент → куратор при необходимости. Первым Академия запускает онлайн-продукт Event Producer; Event Manager запускается позже после проверки площадок, преподавателей, кураторов, календаря и стажировочной базы. Дата 12 октября 2026 года — РАБОЧАЯ ГИПОТЕЗА, не утверждена.","ts":1788124680000,"ws_id":4},{"id":"academy_ctx_5","direction":"academy","done":false,"text":"Текущий статус перепроектирования Simulation Lab\n\nSimulation Lab — практическая часть программы Event Producer: живая иммерсивная профессиональная тренировка, а не тест или компьютерная игра. Сохраняются реальные кейсы, сценарная драматургия без свободной импровизации, несколько допустимых решений и оценка профессионального поведения, soft skills, коммуникации, лидерства, рисков и бюджетного мышления. Термин «актёр» предлагается заменить на «тренер Simulation Lab». Рабочая технологическая модель: постоянные цифровые аватары, которыми в нужных точках управляет живой тренер; AI используется только как вспомогательный инструмент. Документы V.3 и «Допущение для программирования» частично устарели: они содержат 55 часовых тренировок, 70 участников и себестоимость $550 на студента; эти расчёты нельзя считать актуальными до проверки новой архитектуры. Текущая РАБОЧАЯ ГИПОТЕЗА — один сквозной проект по 11 модулям и 11 глубоких недельных симуляций. День X, роль модуля 11, отдельные домашние задания, нагрузка и сертификация тренеров, система расписания, оценка компетенций, финансовая модель, кабинеты тренера и администратора и технология аватаров пока не утверждены. Следующий шаг: разработать один полный пилотный сквозной проект, провести его с реальным студентом и тренерами, затем определить длительность, нагрузку, себестоимость и требования к платформе. Полную production-разработку до пилота не начинать.","ts":1788125040000,"ws_id":5},{"id":"academy_ctx_6","direction":"academy","done":false,"text":"Воронка, путь лида и атрибуция источников\n\nПРИНЯТО. Единая воронка Academy: Посетитель → Контакт → Лид → Выбор оплаты → Студент. Посетитель — визит на сайт; Контакт — оставил телефон, Telegram или email либо начал диалог с ботом; Лид — отправил заявку, запросил консультацию или начал оформление; Студент — оплата подтверждена. Пауза и Закрыто без покупки — дополнительные статусы CRM, не этапы воронки; «недозвон» не используется. Посетители без контакта учитываются в аналитике сайта, но не создаются в CRM. При первом визите и создании контакта сохраняются источник, кампания, креатив, продукт, дата первого визита, первый и последний источник.","ts":1788578220000,"ws_id":6},{"id":"academy_ctx_7","direction":"academy","done":false,"text":"Операционный контур консультаций и тест запуска\n\nПРИНЯТО. Google Meet — единый формат консультаций; запись и транскрипция только после согласия, хранение видео 90 дней. Доступ к видео: Кайрат, Роман и менеджер лида. Ответ на вопрос — до 2 рабочих часов; первые две недели отвечает Кайрат. Полный тестовый путь воронки проводится 10 сентября: реклама → сайт → заявка → бот → звонок → оплата → Студент → LMS.","ts":1788580260000,"ws_id":7},{"id":"academy_ctx_8","direction":"academy","done":false,"text":"План теста и замера воронки Event Producer\n\nПРИНЯТО. Подготовка CRM, бота, оплат и LMS до 9 сентября 18:00 Алматы. Полный тест — 10 сентября, повторный тест проблемных мест — 11 сентября. 16–30 сентября — период замера реального спроса, стоимости лида, конверсий и вопросов без автоматического масштабирования рекламы; 30 сентября — решение о масштабировании.","ts":1788581400000,"ws_id":8},{"id":"academy_ctx_9","direction":"academy","done":false,"text":"Аналогия для короткого видео: Event Manager и Event Producer через ремонт квартиры\n\nИдея короткого объясняющего видео для начинающих: показать разницу между Event Manager и Event Producer через аналогию с ремонтом квартиры. Есть заказчик, который хочет сделать ремонт. Есть организация или отдельный независимый руководитель проекта. Есть ремонтные бригады и узкие специалисты: электрики, сантехники, специалисты по гипсокартону и другие. Через этот пример раскрыть путь: узкий специалист работает в команде, видит весь процесс, затем становится руководителем бригады, а дальше сам начинает вести ремонты или внутри организации возглавляет отдельные проекты. На этой аналогии объяснить роли, ответственность, зону контроля и профессиональный рост: кто такой менеджер, кто такой продюсер и чем отличается узкий исполнитель от руководителя проекта.","ts":1788841606893,"ws_id":9},{"id":"afisha_ctx_11","direction":"afisha","done":false,"text":"Актуальный прототип витрины Afisha.kz — снимок 10.09.2026\n\nИсточник — актуальные локальные исходники прототипа на базе ранней вёрстки Михаила. Сохраняется существующая визуальная структура, меняется контентная и продуктовая логика. Главная построена как эмоциональная персональная витрина впечатлений: 1) шапка и поиск; 2) категории; 3) Reels/слайдер событий; 4) ТОП-10 мест; 5) идеи «Куда сходить»; 6) конструктор «Вечер за X тенге»; 7) новые места; 8) мероприятия по датам; 9) «Город говорит»; 10) мероприятия по настроению; 11) CTA ассистента; 12) редакционные подборки; 13) живая музыка. Блок «Мероприятия по настроению» — горизонтальный адаптивный слайдер с карточками (настроение+эмодзи, изображение, название, дата/формат, CTA «Смотреть подборку · N идей»). CTA пока технические заглушки; количества идей прототипные, не из живой базы. При обсуждении ассистент должен анализировать роль блока в персонализации, состав настроений, событие-герой и переход в подборку. Не просить Кайрата повторно присылать исходники по уже описанной структуре.","ts":1789021328195,"ws_id":11},{"id":"afisha_ctx_2","direction":"afisha","done":false,"text":"Стартовая инструкция ассистента Afisha.kz\n\nДействующие правила работы ассистента Afisha.kz: роль, источники контекста, задачи, решения, уведомления, формат общения и ограничения.","ts":1787908391016,"ws_id":2}],"messages":[{"id":"0rylzdibm2je1vzayl46","author":"Кайрат","direction":"academy","text":"перенеси задачи из  workspace  сюда по академии","ts":1790919902126},{"id":"3qoks2rmatkltovgyr0i","author":"Claude","direction":"academy","text":"Связь в порядке.\n\nПо переносу задач: у меня нет // ---------- Local storage DB shim (replaces Claude's db capability for the
// standalone build — same Firestore-like collection/where/orderBy/limit/
// onSnapshot/add/doc(update|delete|set) surface the app already calls) ----------
const LS_PREFIX = 'eventerWorkspace_';
function lsKey(coll){ return LS_PREFIX+coll; }
function lsRead(coll){ try{ return JSON.parse(localStorage.getItem(lsKey(coll))||'[]'); }catch(e){ return []; } }
function lsWrite(coll, arr){ localStorage.setItem(lsKey(coll), JSON.stringify(arr)); notifyColl(coll); }
const lsListeners = {};
function notifyColl(coll){ (lsListeners[coll]||[]).forEach(fn=>{ try{ fn(); }catch(e){} }); }
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function makeQuery(coll, filters, order, lim){
  return {
    where(field, op, val){ return makeQuery(coll, [...filters, [field,op,val]], order, lim); },
    orderBy(field, dir){ return makeQuery(coll, filters, [field, dir||'asc'], lim); },
    limit(n){ return makeQuery(coll, filters, order, n); },
    onSnapshot(cb, errCb){
      function run(){
        let rows = lsRead(coll).map(r=>({ id:r.id, data:r }));
        filters.forEach(([f,op,val])=>{ rows = rows.filter(r=> op==='==' ? r.data[f]===val : true); });
        if(order){
          const [f,dir] = order;
          rows.sort((a,b)=>{
            const av=a.data[f], bv=b.data[f];
            if(av==null && bv==null) return 0;
            if(av==null) return 1;
            if(bv==null) return -1;
            if(av>bv) return dir==='desc' ? -1 : 1;
            if(av<bv) return dir==='desc' ? 1 : -1;
            return 0;
          });
        }
        if(lim) rows = rows.slice(0, lim);
        const snap = { docs: rows.map(r=>({ id:r.id, data:()=>r.data })), empty: rows.length===0 };
        try{ cb(snap); }catch(e){ console.error(e); }
      }
      lsListeners[coll] = lsListeners[coll] || [];
      lsListeners[coll].push(run);
      run();
      return ()=>{ lsListeners[coll] = (lsListeners[coll]||[]).filter(f=>f!==run); };
    }
  };
}
const dbShim = {
  collection(coll){
    return Object.assign(makeQuery(coll, [], null, null), {
      add(obj){ return new Promise(res=>{ const rows=lsRead(coll); const id=uid(); rows.push({ id, ...obj }); lsWrite(coll, rows); res({ id }); }); },
      doc(id){
        return {
          update(patch){ return new Promise((res,rej)=>{ const rows=lsRead(coll); const i=rows.findIndex(r=>r.id===id); if(i<0) return rej(new Error('not-found')); rows[i]={...rows[i], ...patch}; lsWrite(coll, rows); res(); }); },
          set(obj){ return new Promise(res=>{ const rows=lsRead(coll); const i=rows.findIndex(r=>r.id===id); if(i<0) rows.push({ id, ...obj }); else rows[i]={ id, ...obj }; lsWrite(coll, rows); res(); }); },
          delete(){ return new Promise(res=>{ const rows=lsRead(coll).filter(r=>r.id!==id); lsWrite(coll, rows); res(); }); }
        };
      }
    });
  }
};

function fmtMoney(n){
  if(n==null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  let s;
  if(abs>=1e9) s = (n/1e9).toFixed(2).replace(/\.00$/,'') + ' млрд ₸';
  else if(abs>=1e6) s = (n/1e6).toFixed(1).replace(/\.0$/,'') + ' млн ₸';
  else s = Math.round(n).toLocaleString('ru-RU') + ' ₸';
  return s;
}
function fmtInt(n){ return n==null||isNaN(n) ? '—' : Math.round(n).toLocaleString('ru-RU'); }
function parseMoney(str){
  if(str==null) return null;
  const cleaned = String(str).replace(/[\s  ]/g,'').replace(/₸/g,'').replace(/,/g,'.');
  const v = parseFloat(cleaned);
  return isNaN(v) ? null : v;
}
function findRow(rows, label){
  return rows.find(r => r && String(r[0]||'').trim() === label) || null;
}
function lastVal(row){
  if(!row) return null;
  for(let i=row.length-1;i>=1;i--){ const v=parseMoney(row[i]); if(v!==null) return v; }
  return null;
}

  function renderDayList(){
    const todayEnd = dayBounds(1);
    let docs;
    let emptyMsg;
    if(dayMode==='today'){
      // "Сегодня" = actionable now: anything overdue plus anything due today —
      // matches how the old Workspace's "Главный менеджер" surfaced the day's work.
      docs = allDocs.filter(d=> !d.data.parentId && d.data.status!=='done' && d.data.status!=='postponed' && d.data.due && d.data.due<todayEnd);
      emptyMsg = 'Нет задач на сегодня — всё закрыто.';
    } else if(dayMode==='tomorrow'){
      const start = dayBounds(1), end = dayBounds(2);
      docs = allDocs.filter(d=> !d.data.parentId && d.data.due && d.data.due>=start && d.data.due<end);
      emptyMsg = 'Нет задач на завтра.';
    } else if(dayMode==='week'){
      const end = dayBounds(7);
      docs = allDocs.filter(d=> !d.data.parentId && d.data.status!=='done' && d.data.status!=='postponed' && d.data.due && d.data.due<end);
      emptyMsg = 'На ближайшую неделю задач нет.';
    } else {
      docs = allDocs.filter(d=> !d.data.parentId && d.data.status!=='done' && d.data.status!=='postponed');
      emptyMsg = 'Активных задач нет.';
    }
    docs = docs.slice().sort((a,b)=>(a.data.due||Infinity)-(b.data.due||Infinity));
    if(!docs.length){ taskListEl.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
    taskListEl.innerHTML = docs.map(({id,data:v})=>{
      const dirObj = DIRECTIONS.find(d=>d.slug===v.direction);
      const overdue = isOverdue(v);
      return `<div class="task ${overdue?'overdue':''}" data-id="${id}" data-dir="${v.direction}">
        <div class="task-row" style="flex-wrap:wrap;row-gap:4px">
          <input type="checkbox" class="chk" ${v.status==='done'?'checked':''}/>

          <span class="pill ${overdue?'bad':''}" style="flex:none;margin-left:auto">${overdue?'Просрочена · ':''}${v.due?(v.hasDueTime?fmtDueTime(v.due):fmtDue(v.due)):'без срока'}</span>
        </div>

  // events

}

const TASK_FILTERS = [['active','Активные'],['all','Все'],['overdue','Просроченные'],['postponed','Отложенные']];
const PRIORITY_LABELS = { high:'Высокий', medium:'Средний', low:'Низкий' };
// Body-attached floating menu (fixed position, computed from the anchor button) —
// unlike an absolutely-positioned child it never gets clipped by a card's overflow:hidden.
function openFloatingMenu(anchorEl, buildFn){
  document.querySelectorAll('.floating-menu').forEach(x=>x.remove());
  const menu = document.createElement('div');
  menu.className = 'floating-menu';
  document.body.appendChild(menu);
  buildFn(menu);
  const r = anchorEl.getBoundingClientRect();
  const menuW = menu.offsetWidth || 180;
  let left = Math.min(r.left, window.innerWidth - menuW - 8);
  left = Math.max(8, left);
  let top = r.bottom + 4;
  if(top + menu.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - menu.offsetHeight - 4);
  menu.style.left = left+'px';
  menu.style.top = top+'px';
  function close(){ menu.remove(); document.removeEventListener('mousedown', onOutside, true); document.removeEventListener('keydown', onEsc, true); }
  function onOutside(ev){ if(!menu.contains(ev.target) && ev.target!==anchorEl) close(); }
  function onEsc(ev){ if(ev.key==='Escape') close(); }
  setTimeout(()=>{ document.addEventListener('mousedown', onOutside, true); document.addEventListener('keydown', onEsc, true); }, 0);
  return { menu, close };
}

function fmtDue(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDueTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const date = d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'});
  const time = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return `${date} · ${time}`;
}
function isOverdue(t){
  return t.status!=='done' && t.status!=='postponed' && t.due && t.due < Date.now();
}
// Checklist items can carry their own nested sub-items (e.g. a subtask that itself
// had a checklist in the old Workspace). Shared rendering + wiring for both the
// inline expand panel and the full task-form modal.
function escHtml(s){ return (s||'').replace(/</g,'&lt;'); }
function checklistItemHTML(c, i, opts){
  opts = opts || {};
  const subs = Array.isArray(c.items) ? c.items : [];
  const subRows = subs.map((s,j)=>`<div class="ci" data-j="${j}"><input type="checkbox" ${s.done?'checked':''}/><span class="ct ${s.done?'done':''}">${escHtml(s.text)}</span><button class="ci-del">×</button></div>`).join('');
  const addSubRow = opts.allowAddSub ? `<div class="ci-sub-add"><input type="text" placeholder="Добавить пункт…" class="ciSubInput"/><button class="btn ghost ciSubAdd" style="padding:4px 8px">+</button></div>` : '';
  return `<div class="ci-block" data-i="${i}">
    <div class="ci"><input type="checkbox" ${c.done?'checked':''}/><span class="ct ${c.done?'done':''}">${escHtml(c.text)}</span><button class="ci-del">×</button></div>
    ${(subs.length || opts.allowAddSub)?`<div class="ci-sub">${subRows}</div>`:''}
    ${addSubRow}
  </div>`;
}
function wireChecklistBlocks(container, list, save, rerender){
  container.querySelectorAll('.ci-block').forEach(block=>{
    const i = Number(block.dataset.i);
    const mainRow = block.querySelector(':scope > .ci');
    mainRow.querySelector('input[type=checkbox]').addEventListener('change', e=>{
      list[i] = { ...list[i], done: e.target.checked };
      save();
    });
    mainRow.querySelector('.ci-del').addEventListener('click', ()=>{
      list.splice(i,1);
      save(); rerender();
    });
    block.querySelectorAll('.ci-sub .ci').forEach(subRow=>{
      const j = Number(subRow.dataset.j);
      subRow.querySelector('input[type=checkbox]').addEventListener('change', e=>{
        const items = (list[i].items||[]).slice();
        items[j] = { ...items[j], done: e.target.checked };
        list[i] = { ...list[i], items };
        save();
      });
      subRow.querySelector('.ci-del').addEventListener('click', ()=>{
        const items = (list[i].items||[]).slice();
        items.splice(j,1);
        list[i] = { ...list[i], items };
        save(); rerender();
      });
    });
    const subAddInput = block.querySelector('.ciSubInput');
    const subAddBtn = block.querySelector('.ciSubAdd');
    if(subAddInput && subAddBtn){
      function addSub(){
        const t = subAddInput.value.trim(); if(!t) return;
        const items = (list[i].items||[]).slice();
        items.push({ text:t, done:false });
        list[i] = { ...list[i], items };
        save(); rerender();
      }
      subAddBtn.addEventListener('click', addSub);
      subAddInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addSub(); });
    }
  });
}

  let allDocs = [];
  const openSet = new Set();
  const openSubSet = new Set();

  function countsFor(scopedDocs){
    return {
      active: scopedDocs.filter(d=> d.data.status!=='done' && d.data.status!=='postponed').length,
      all: scopedDocs.length,
      overdue: scopedDocs.filter(d=> isOverdue(d.data)).length,
      postponed: scopedDocs.filter(d=> d.data.status==='postponed').length,
    };
  }

  function applyFilterAndRender(){
    // Subtasks (tasks with a parentId) are full tasks of their own, but they live
    // nested under their parent's "+" toggle rather than as flat rows here.
    const topDocs = allDocs.filter(d=> !d.data.parentId);
    let scoped = projectFilter ? topDocs.filter(d=> (d.data.project||'')===projectFilter) : topDocs;
    const counts = countsFor(scoped);
    filterTabsEl.querySelectorAll('.filter-count').forEach(el=>{ el.textContent = counts[el.dataset.c] ?? 0; });

    let docs = scoped;
    if(filter==='active') docs = docs.filter(d=> d.data.status!=='done' && d.data.status!=='postponed');
    else if(filter==='overdue') docs = docs.filter(d=> isOverdue(d.data));
    else if(filter==='postponed') docs = docs.filter(d=> d.data.status==='postponed');
    // 'all' = no extra filtering
    if(!docs.length){ listEl.innerHTML = '<div class="empty">Нет задач по этому фильтру.</div>'; return; }
    listEl.innerHTML = docs.map(({id,data:v})=>{
      const checklist = Array.isArray(v.checklist) ? v.checklist : [];
      const hasChecklist = checklist.length>0;
      const overdue = isOverdue(v);
      const expanded = openSet.has(id);
      const pri = v.priority || 'medium';
      const subs = allDocs.filter(d=> d.data.parentId===id);
      const subOpen = openSubSet.has(id);
      return `
      <div class="task ${overdue?'overdue':''}" data-id="${id}">
        <div class="task-row">
          <button class="task-exp" data-id="${id}" ${hasChecklist?'':'disabled'}>${hasChecklist?(expanded?'▾':'▸'):'·'}</button>
          <input type="checkbox" class="chk" ${v.status==='done'?'checked':''}/>
          <div class="task-id-col">
            ${v.no?`<span class="task-id">ID ${v.no}</span>`:''}
            ${subs.length?`<button class="task-sub-toggle" data-id="${id}" title="Подзадачи">${subOpen?'−':'+'}${subs.length}</button>`:''}
          </div>
          <div class="task-title ${v.status==='done'?'done':''}">${(v.text||'').replace(/</g,'&lt;')}</div>
          <div class="task-meta">
            <button class="task-proj">${v.project ? v.project.replace(/</g,'&lt;') : 'Без проекта'}</button>
            <button class="pri-btn ${pri}" data-pri="${pri}">${PRIORITY_LABELS[pri]}</button>
            <button class="task-pp" title="${v.status==='postponed'?'Вернуть в активные':'Отложить'}">${v.status==='postponed'?'▶':'⏸'}</button>
            <button class="task-due" data-due="${v.due||''}">${v.due?(v.hasDueTime?fmtDueTime(v.due):fmtDue(v.due)):'+ срок'}</button>
            <button class="task-del" title="Удалить">×</button>
          </div>
        </div>
        ${expanded?`<div class="task-checklist">
          ${checklist.map((c,i)=>checklistItemHTML(c,i)).join('')}
          <div class="ci-add"><input type="text" placeholder="Добавить пункт…" class="ciInput"/><button class="btn ghost ciAdd">+</button></div>
        </div>`:''}
        ${subOpen && subs.length ? `<div class="task-subtasks">
          ${subs.map(s=>`<div class="subtask-row ${isOverdue(s.data)?'overdue':''}" data-id="${s.id}">
            <input type="checkbox" class="chk-sub" ${s.data.status==='done'?'checked':''}/>
            ${s.data.no?`<span class="task-id">ID ${s.data.no}</span>`:''}
            <span class="subtask-title ${s.data.status==='done'?'done':''}">${(s.data.text||'').replace(/</g,'&lt;')}</span>
            <span class="subtask-due ${isOverdue(s.data)?'overdue':''}">${s.data.due?fmtDue(s.data.due):'без срока'}</span>
            <span class="subtask-status-badge ${s.data.status||'active'}">${s.data.status==='postponed'?'Отложена':s.data.status==='done'?'Завершена':'Активна'}</span>
          </div>`).join('')}
        </div>`:''}
      </div>`;
    }).join('');

    // open the full task form (anything except the interactive controls in the row)
    listEl.querySelectorAll('.task-title').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.closest('.task').dataset.id;
        openTaskModal(col, id, ()=>allDocs.find(d=>d.id===id));
      });
    });
    // checkbox: done toggle
    listEl.querySelectorAll('.task .chk').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const id = cb.closest('.task').dataset.id;
        col.doc(id).update({ status: cb.checked?'done':'active' }).catch(()=>{});
      });
    });
    // subtasks: expand/collapse toggle next to the task id
    listEl.querySelectorAll('.task-sub-toggle').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        if(openSubSet.has(id)) openSubSet.delete(id); else openSubSet.add(id);
        applyFilterAndRender();
      });
    });
    // subtasks: each one is a full task of its own — open the same task form
    listEl.querySelectorAll('.subtask-row').forEach(row=>{
      row.addEventListener('click', e=>{
        if(e.target.classList.contains('chk-sub')) return;
        const id = row.dataset.id;
        openTaskModal(col, id, ()=>allDocs.find(d=>d.id===id));
      });
      row.querySelector('.chk-sub').addEventListener('change', e=>{
        const id = row.dataset.id;
        col.doc(id).update({ status: e.target.checked?'done':'active' }).catch(()=>{});
      });
    });
    // project: inline edit
    // project: floating dropdown — pick an existing project used in this direction,
    // clear to "Без проекта", or type a new one
    listEl.querySelectorAll('.task-proj').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const id = btn.closest('.task').dataset.id;
        const cur = allDocs.find(d=>d.id===id);
        const curProj = (cur && cur.data.project) || '';
        const known = [...new Set([...dirProjectNames, ...allDocs.map(d=>d.data.project).filter(Boolean)])].sort();
        const { menu, close } = openFloatingMenu(btn, m=>{
          m.innerHTML = `
            <button class="fm-item ${!curProj?'sel':''}" data-v="">Без проекта</button>
            ${known.map(p=>`<button class="fm-item ${p===curProj?'sel':''}" data-v="${p.replace(/"/g,'&quot;')}">${p.replace(/</g,'&lt;')}</button>`).join('')}
            <div class="fm-sep"></div>
            <div class="fm-addrow"><input type="text" placeholder="Новый проект…" class="fmNewProj"/><button class="btn" style="padding:5px 9px">+</button></div>`;
          m.querySelectorAll('.fm-item').forEach(opt=>{
            opt.addEventListener('click', ()=>{ col.doc(id).update({ project: opt.dataset.v||null }).catch(()=>{}); close(); });
          });
          const npInput = m.querySelector('.fmNewProj');
          const npBtn = m.querySelector('.fm-addrow .btn');
          function addNew(){ const v = npInput.value.trim(); if(!v) return; col.doc(id).update({ project: v }).catch(()=>{}); db.collection('projects').add({ name:v, direction:dirSlug, ts: Date.now() }).catch(()=>{}); close(); }
          npBtn.addEventListener('click', addNew);
          npInput.addEventListener('keydown', ev=>{ if(ev.key==='Enter') addNew(); });
        });
      });
    });
    // priority: floating dropdown
    listEl.querySelectorAll('.pri-btn').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const id = btn.closest('.task').dataset.id;
        const curPri = btn.dataset.pri;
        openFloatingMenu(btn, m=>{
          m.innerHTML = Object.entries(PRIORITY_LABELS).map(([k,l])=>`<button class="fm-item ${k===curPri?'sel':''}" data-pri="${k}">${l}</button>`).join('');
          m.querySelectorAll('.fm-item').forEach(opt=>{
            opt.addEventListener('click', ()=>{ col.doc(id).update({ priority: opt.dataset.pri }).catch(()=>{}); m.remove(); });
          });
        });
      });
    });
    // postpone toggle
    listEl.querySelectorAll('.task-pp').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.closest('.task').dataset.id;
        const cur = allDocs.find(d=>d.id===id);
        const next = cur && cur.data.status==='postponed' ? 'active' : 'postponed';
        col.doc(id).update({ status: next }).catch(()=>{});
      });
    });
    // delete
    listEl.querySelectorAll('.task-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.closest('.task').dataset.id;
        col.doc(id).delete().catch(()=>{});
      });
    });
    // expand/collapse checklist
    listEl.querySelectorAll('.task-exp').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.disabled) return;
        const id = btn.dataset.id;
        if(openSet.has(id)) openSet.delete(id); else openSet.add(id);
        applyFilterAndRender();
      });
    });
    // inline due-date edit: click turns the button into a date input
    listEl.querySelectorAll('.task-due').forEach(btn=>{
      btn.addEventListener('click', function handler(){
        const id = btn.closest('.task').dataset.id;
        const cur = btn.dataset.due ? new Date(Number(btn.dataset.due)).toISOString().slice(0,10) : '';
        const inp = document.createElement('input');
        inp.type = 'date'; inp.value = cur;
        btn.replaceWith(inp);
        inp.focus();
        function commit(){
          const ts = inp.value ? new Date(inp.value+'T00:00:00').getTime() : null;
          col.doc(id).update({ due: ts, hasDueTime: false }).catch(()=>{});
        }
        inp.addEventListener('change', commit);
        inp.addEventListener('blur', ()=> applyFilterAndRender());
      });
    });
    // checklist item toggles / delete / add (supports nested sub-checklists)
    listEl.querySelectorAll('.task').forEach(taskEl=>{
      const id = taskEl.dataset.id;
      const cur = allDocs.find(d=>d.id===id);
      if(!cur) return;
      const list = (cur.data.checklist||[]).slice();
      wireChecklistBlocks(
        taskEl,
        list,
        ()=> col.doc(id).update({ checklist: list }).catch(()=>{}),
        applyFilterAndRender
      );
      const addInput = taskEl.querySelector('.ciInput');
      const addBtn = taskEl.querySelector('.ciAdd');
      if(addInput && addBtn){
        function addItem(){
          const t = addInput.value.trim(); if(!t) return;
          const freshList = (cur.data.checklist||[]).slice();
          freshList.push({ text:t, done:false });
          col.doc(id).update({ checklist: freshList }).catch(()=>{});
        }
        addBtn.addEventListener('click', addItem);
        addInput.addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
      }
    });
  }

  const unsub = q.onSnapshot(snap=>{
    allDocs = snap.docs.map(d=>({ id:d.id, data:d.data() }));
    const projects = [...new Set(allDocs.map(d=>d.data.project).filter(Boolean))].sort();
    const curVal = projectSelect.value;
    projectSelect.innerHTML = '<option value="">Все проекты</option>' + projects.map(p=>`<option value="${p.replace(/"/g,'&quot;')}">${p}</option>`).join('');
    projectSelect.value = projects.includes(curVal) ? curVal : '';
    applyFilterAndRender();
    refreshOpenModal();
  }, err=>{ listEl.innerHTML = `<div class="empty">Нет доступа на чтение (${err.code}).</div>`; });
  unsubs['tasks']=unsub;

  filterTabsEl.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-f]'); if(!btn) return;
    filter = btn.dataset.f;
    filterTabsEl.querySelectorAll('button[data-f]').forEach(b=>b.classList.toggle('active', b===btn));
    applyFilterAndRender();
  });
  projectSelect.addEventListener('change', ()=>{ projectFilter = projectSelect.value; applyFilterAndRender(); });

  // Projects registry (for the project picker and, later, a cross-direction project
  // directory): every project created from here is tagged with this direction.
  const projectsCol = db.collection('projects');
  dirProjectNames = [];
  const unsubProj = projectsCol.where('direction','==',dirSlug).orderBy('name').limit(200).onSnapshot(snap=>{
    dirProjectNames = snap.docs.map(d=>d.data().name).filter(Boolean);
  }, ()=>{});
  unsubs['projects']=unsubProj;

  const addBtnTop = panel.querySelector('#addTask');
  addBtnTop.addEventListener('click', ()=>{
    openFloatingMenu(addBtnTop, m=>{
      m.innerHTML = `
        <button class="fm-item" data-v="task">Задача</button>
        <button class="fm-item" data-v="project">Проект</button>`;
      m.querySelector('[data-v="task"]').addEventListener('click', async ()=>{
        m.remove();
        try{
          const nextNo = allDocs.reduce((mx,d)=> Math.max(mx, d.data.no||0), 0) + 1;
          const draft = { text:'', direction:dirSlug, project:null, due:null, status:'active', priority:'medium', responsible:'', expected:'', checklist:[], no:nextNo, ts: Date.now() };
          const ref = await col.add(draft);
          openTaskModal(col, ref.id, ()=> allDocs.find(d=>d.id===ref.id) || { id:ref.id, data:draft });
        }catch(e){ alert('Не удалось создать задачу: '+(e&&e.code||e)); }
      });
      m.querySelector('[data-v="project"]').addEventListener('click', ()=>{
        m.remove();
        openNewProjectPrompt(dirSlug, DIRECTIONS.find(d=>d.slug===dirSlug));
      });
    });
  });
}

// Minimal "add project" prompt — always tagged with the direction it was opened from,
// so a future cross-direction project registry can group by direction.
function openNewProjectPrompt(dirSlug, dirObj){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'newProjectBackdrop';
  backdrop.innerHTML = `
    <div class="modal-card" style="max-width:380px">
      <div class="modal-head">
        <div style="flex:1">
          <div class="modal-label" style="margin-bottom:6px">Новый проект · ${dirObj?dirObj.name:''}</div>
          <input type="text" id="npName" placeholder="Название проекта"/>
        </div>
        <button class="modal-close" id="npClose">×</button>
      </div>
      <div class="modal-row" style="margin-top:14px">
        <button class="btn" id="npCreate">Создать</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); }
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) close(); });
  backdrop.querySelector('#npClose').addEventListener('click', close);
  const nameInput = backdrop.querySelector('#npName');
  nameInput.focus();
  async function create(){
    const name = nameInput.value.trim();
    if(!name || !db) return;
    try{
      await db.collection('projects').add({ name, direction: dirSlug, ts: Date.now() });
      close();
    }catch(e){ alert('Не удалось создать проект: '+(e&&e.code||e)); }
  }
  backdrop.querySelector('#npCreate').addEventListener('click', create);
  nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') create(); });
}

// ---------- Full task form (opens like a K-Workspace task card) ----------
let activeModalId = null, activeModalGetter = null;
function refreshOpenModal(){
  if(!activeModalId) return;
  const cur = activeModalGetter && activeModalGetter();
  if(!cur){ closeTaskModal(); return; }
  // Don't fight the user's typing: only refresh static display bits, not focused inputs.
  const backdrop = document.getElementById('taskModalBackdrop');
  if(!backdrop) return;
}
function closeTaskModal(){
  const el = document.getElementById('taskModalBackdrop');
  if(el) el.remove();
  activeModalId = null; activeModalGetter = null;
}

}

function openTaskModal(col, id, getter){
  closeTaskModal();
  activeModalId = id; activeModalGetter = getter;
  const cur = getter(); if(!cur) return;
  const v = cur.data;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'taskModalBackdrop';
  const checklist = Array.isArray(v.checklist) ? v.checklist : [];
  const pri = v.priority || 'medium';
  const status = v.status || 'active';
  backdrop.innerHTML = `
    <div class="modal-card">
      <div class="modal-head">
        <div style="flex:1">
          ${v.no?`<div class="task-id" style="margin-bottom:4px">ID ${v.no}</div>`:''}
          <textarea class="modal-title-input" id="mTitle" rows="2">${(v.text||'').replace(/</g,'&lt;')}</textarea>
        </div>
        <button class="modal-close" id="mClose">×</button>
      </div>
      <div class="modal-row">
        <div class="modal-field" style="flex:1;min-width:160px">
          <div class="modal-label">Проект</div>

        <button class="btn" id="mDone">Готово</button>
      </div>

  document.body.appendChild(backdrop);

  function patch(data){ col.doc(id).update(data).catch(()=>{}); }
  // The checklist lives in local state for the modal's lifetime so edits render
  // instantly, instead of waiting on the async db round-trip + snapshot refresh.
  let localChecklist = checklist.slice();

  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeTaskModal(); });
  backdrop.querySelector('#mClose').addEventListener('click', closeTaskModal);
  backdrop.querySelector('#mDone').addEventListener('click', closeTaskModal);
  backdrop.querySelector('#mDelete').addEventListener('click', ()=>{
    col.doc(id).delete().catch(()=>{});
    closeTaskModal();
  });
  const titleEl = backdrop.querySelector('#mTitle');
  titleEl.addEventListener('blur', ()=> patch({ text: titleEl.value.trim() }));
  if(!v.text) titleEl.focus();
  const projEl = backdrop.querySelector('#mProj');
  projEl.addEventListener('blur', ()=>{
    const name = projEl.value.trim();
    patch({ project: name||null });
    if(name && db) db.collection('projects').add({ name, direction: v.direction, ts: Date.now() }).catch(()=>{});
  });
  const dueEl = backdrop.querySelector('#mDue');
  const dueTimeEl = backdrop.querySelector('#mDueTime');
  const remindWrap = backdrop.querySelector('#mRemindWrap');
  function recomputeDue(){
    const dateVal = dueEl.value;

    const due = dateVal ? new Date(dateVal+'T'+(timeVal||'00:00')+':00').getTime() : null;
    const hasDueTime = !!(dateVal && timeVal);
    remindWrap.style.display = hasDueTime ? '' : 'none';
    patch({ due, hasDueTime });
  }
  dueEl.addEventListener('change', recomputeDue);
  dueTimeEl.addEventListener('change', recomputeDue);
  backdrop.querySelector('#mRemind').addEventListener('change', e=> patch({ reminderMinutes: Number(e.target.value) }));
  const respEl = backdrop.querySelector('#mResp');
  respEl.addEventListener('blur', ()=> patch({ responsible: respEl.value.trim() }));
  const expEl = backdrop.querySelector('#mExpected');
  expEl.addEventListener('blur', ()=> patch({ expected: expEl.value.trim() }));
  backdrop.querySelector('#mPri').querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      patch({ priority: btn.dataset.v });
      backdrop.querySelector('#mPri').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
    });
  });
  backdrop.querySelector('#mStatus').querySelectorAll('button').forEach(btn=>{

      backdrop.querySelector('#mStatus').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
    });

  const checklistBox = backdrop.querySelector('#mChecklist');
  function renderChecklist(){
    const focusWasOnInput = document.activeElement && document.activeElement.classList.contains('ciInput');
    checklistBox.innerHTML = `
      ${localChecklist.map((c,i)=>checklistItemHTML(c,i,{allowAddSub:true})).join('')}
      <div class="ci-add"><input type="text" placeholder="Добавить подзадачу…" class="ciInput"/><button class="btn ghost ciAdd">+ Подзадача</button></div>`;
    wireChecklistBlocks(
      checklistBox,
      localChecklist,
      ()=> patch({ checklist: localChecklist }),
      renderChecklist
    );
    const addInput = checklistBox.querySelector('.ciInput');
    const addBtn = checklistBox.querySelector('.ciAdd');
    function addItem(){
      const t = addInput.value.trim(); if(!t) return;
      localChecklist.push({ text:t, done:false });
      patch({ checklist: localChecklist });
      renderChecklist();
      checklistBox.querySelector('.ciInput').focus();
    }
    addBtn.addEventListener('click', addItem);
    addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); } });
    if(focusWasOnInput) checklistBox.querySelector('.ciInput').focus();
  }
  renderChecklist();
}

// ---------- Decisions / Context (db-backed) ----------
// Splits a record's combined text into an optional leading "[СТАТУС]" tag,
// a title (first line / first paragraph) and the rest of the body — so the
// list can show a scannable title and reveal the full text on click.
function splitRecordText(raw){
  let rest = String(raw||'');
  let tag = '';
  const m = rest.match(/^\[([^\]]+)\]\s*/);
  if(m){ tag = m[1]; rest = rest.slice(m[0].length); }
  const idx = rest.indexOf('\n\n');
  const title = (idx===-1 ? rest : rest.slice(0,idx)).trim();
  const body = (idx===-1 ? '' : rest.slice(idx+2)).trim();
  return { tag, title, body };
}
function renderRecordList(panel, kind, dirSlug){
  const labels = { decisions:{add:'Зафиксировать решение', ph:'Короткая формулировка решения…', empty:'Решений пока нет.'},
                    context:{add:'Добавить заметку', ph:'Контекст, факт, ссылка…', empty:'Контекста пока нет.'} };
  const L = labels[kind];
  // Решения/Контекст are read-only for employees — they can see the history
  // but only the admin records new ones (mirrors the Supabase RLS policy).
  const readOnly = !isAdmin();
  panel.innerHTML = `
    <div class="card">
      ${readOnly ? '' : `<div class="row">
        <input type="text" id="newItem" placeholder="${L.ph}"/>
        <button class="btn" id="addItem">${L.add}</button>
      </div>`}
      <div class="list" id="itemList"><div class="empty">Загрузка…</div></div>
    </div>`;
  if(!db){ panel.querySelector('#itemList').innerHTML = '<div class="empty">База данных недоступна в этом окне.</div>'; return; }
  const col = db.collection(kind);
  const q = col.where('direction','==',dirSlug).orderBy('ts','desc').limit(200);
  const listEl = panel.querySelector('#itemList');
  const openSet = new Set();
  const deleteArmed = new Set();
  let docsCache = [];

  function draw(){
    if(!docsCache.length){ listEl.innerHTML = `<div class="empty">${L.empty}</div>`; return; }
    // Numbering stays chronological (oldest = №1) regardless of display order,
    // but the list itself is shown newest-first, like tasks and events.
    const ascOrder = docsCache.slice().sort((a,b)=> (a.v.ts||0)-(b.v.ts||0));
    const numById = {};
    ascOrder.forEach((d,i)=>{ numById[d.id] = i+1; });
    const displayOrder = docsCache.slice().sort((a,b)=> (b.v.ts||0)-(a.v.ts||0));
    listEl.innerHTML = displayOrder.map(({id,v})=>{
      const { tag, title, body } = splitRecordText(v.text);
      const expanded = openSet.has(id);
      const armed = deleteArmed.has(id);
      const n = numById[id];
      const dateStr = new Date(v.ts||Date.now()).toLocaleDateString('ru-RU');
      const noLabel = kind==='decisions' ? `Решение №${n} от ${dateStr}` : `Контекст №${n} от ${dateStr}`;
      return `<div class="item record-item" data-id="${id}">
        <div class="record-head" data-id="${id}" style="display:flex;align-items:center;gap:8px;cursor:${body?'pointer':'default'}">
          ${body?`<button class="task-exp" data-id="${id}">${expanded?'▾':'▸'}</button>`:'<span class="task-exp" style="visibility:hidden">▸</span>'}
          ${tag && kind!=='decisions' ? `<span class="pill">${tag.replace(/</g,'&lt;')}</span>` : ''}
          <div class="txt" style="flex:1"><b style="opacity:.75">${noLabel}:</b> ${title.replace(/</g,'&lt;')}</div>
          ${readOnly ? '' : `<button class="del" title="${armed?'Нажмите ещё раз, чтобы подтвердить удаление':'Удалить'}" style="margin-left:14px;flex-shrink:0;${armed?'background:#e5484d;color:#fff;border-radius:6px;padding:3px 10px;font-size:12px;border:none;cursor:pointer':'background:transparent;border:none;opacity:.55;cursor:pointer;font-size:14px'}">${armed?'Удалить?':'🗑'}</button>`}
        </div>
        ${expanded && body ? `<div class="record-body" style="padding:8px 0 4px 30px;color:var(--fg-muted);white-space:pre-wrap">${body.replace(/</g,'&lt;')}</div>` : ''}
      </div>`;
    }).join('');
    listEl.querySelectorAll('.record-head').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.del')) return;
        const id = row.dataset.id;
        const doc = docsCache.find(d=>d.id===id);
        if(!doc || !splitRecordText(doc.v.text).body) return;
        if(openSet.has(id)) openSet.delete(id); else openSet.add(id);
        draw();
      });
    });
    listEl.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.closest('.item').dataset.id;
        if(deleteArmed.has(id)){
          deleteArmed.delete(id);
          col.doc(id).delete().catch(()=>{});
        } else {
          deleteArmed.add(id);
          draw();
          setTimeout(()=>{ if(deleteArmed.has(id)){ deleteArmed.delete(id); draw(); } }, 3000);
        }
      });
    });
  }

  const unsub = q.onSnapshot(snap=>{
    docsCache = snap.docs.map(d=>({ id:d.id, v:d.data() }));
    draw();
  }, err=>{ listEl.innerHTML = `<div class="empty">Нет доступа на чтение (${err.code}).</div>`; });
  unsubs[kind]=unsub;

  if(readOnly) return;
  const input = panel.querySelector('#newItem');
  const addBtn = panel.querySelector('#addItem');
  async function submit(){
    const text = input.value.trim();
    if(!text) return;
    addBtn.disabled = true;
    try{
      await col.add({ text, direction:dirSlug, done:false, ts: Date.now() });
      input.value='';
    }catch(e){ alert('Не удалось сохранить: '+(e&&e.code||e)); }
    addBtn.disabled = false;
  }
  addBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// ---------- Messages (db-backed; auto-answered by the direction's RM, or by
// whoever you @-mention — Финансовый директор for Finance, Гл менеджер in general) ----------
function renderMessages(panel, dirSlug){
  const curDir = DIRECTIONS.find(d=>d.slug===dirSlug);
  const myTitle = roleTitle(dirSlug);
  panel.innerHTML = `
    <div class="card">
      <div class="list" id="msgList"><div class="empty">Загрузка…</div></div>
      <div class="row" style="margin-top:12px;align-items:flex-start">
        <div class="chat-input-wrap">
          <div class="mention-box" id="mentionBox" style="display:none"></div>
          <input type="text" id="msgInput" placeholder="Сообщение — ответит ${myTitle}. Начни с @, чтобы адресовать другому направлению…"/>
        </div>
        <button class="btn" id="sendMsg">Отправить</button>
      </div>
    </div>`;
  if(!db){ panel.querySelector('#msgList').innerHTML = '<div class="empty">База данных недоступна.</div>'; return; }
  const col = db.collection('messages');
  const q = col.where('direction','==',dirSlug).orderBy('ts','desc').limit(50);
  const listEl = panel.querySelector('#msgList');
  let latest = [];
  const unsub = q.onSnapshot(snap=>{
    latest = snap.docs.map(d=>d.data()).reverse();
    if(!latest.length){ listEl.innerHTML = `<div class="empty">Сообщений пока нет — просто напиши, ответит ${myTitle}.</div>`; return; }
    listEl.innerHTML = latest.map(m=>{
      const toTag = m.to && m.to!==dirSlug ? `<span class="to-tag">→ ${roleTitle(m.to).replace(/</g,'&lt;')}</span>` : '';
      return `
      <div class="msg ${m.role?'claude':''}">
        <div class="who">${(m.author||'').replace(/</g,'&lt;')}${toTag}</div>
        <div>${(m.text||'').replace(/</g,'&lt;')}</div>
      </div>`;
    }).join('');
    listEl.scrollTop = listEl.scrollHeight;
  }, err=>{ listEl.innerHTML = `<div class="empty">Нет доступа (${err.code}).</div>`; });
  unsubs['messages']=unsub;

  const input = panel.querySelector('#msgInput');
  const mentionBox = panel.querySelector('#mentionBox');
  const sendBtn = panel.querySelector('#sendMsg');

  async function post(author, text, extra){
    await col.add({ direction:dirSlug, author, text, ts: Date.now(), ...(extra||{}) });
  }

  // --- "@" mention autocomplete: lets a message in this chat be addressed to
  // another direction's RM, the Финансовый директор, or the general Гл менеджер ---
  function mentionQuery(){
    const upto = input.value.slice(0, input.selectionStart ?? input.value.length);
    const m = /(^|\s)@([^\s@]*)$/.exec(upto);
    return m ? m[2] : null;
  }
  function closeMention(){ mentionBox.style.display='none'; mentionBox.innerHTML=''; }
  function openMention(qtext){
    const q = qtext.toLowerCase();
    const matches = MENTION_TARGETS.filter(t=> t.label.toLowerCase().includes(q) || t.hint.toLowerCase().includes(q));
    if(!matches.length){ closeMention(); return; }
    mentionBox.innerHTML = matches.map((t,i)=>`<div class="mention-item${i===0?' hi':''}" data-label="${t.label.replace(/"/g,'&quot;')}"><span class="mn">${t.label}</span><span class="md">${t.hint}</span></div>`).join('');
    mentionBox.style.display='block';
    mentionBox.querySelectorAll('.mention-item').forEach(el=>{
      el.addEventListener('mousedown', e=>{ e.preventDefault(); pickMention(el.dataset.label); });
    });
  }
  function pickMention(label){
    const pos = input.selectionStart ?? input.value.length;
    const before = input.value.slice(0, pos).replace(/(^|\s)@([^\s@]*)$/, `$1@[${label}] `);
    input.value = before + input.value.slice(pos);
    closeMention();
    input.focus();
  }
  input.addEventListener('input', ()=>{
    const q = mentionQuery();
    if(q!==null) openMention(q); else closeMention();
  });
  input.addEventListener('blur', ()=> setTimeout(closeMention, 150));

  // A message starting with "@[Role Label] " is addressed to that role; otherwise
  // it goes to this direction's own RM (or Финансовый директор, for Finance).
  function parseMention(text){
    const m = /^@\[([^\]]+)\]\s*([\s\S]*)$/.exec(text.trim());
    if(!m) return null;
    const target = MENTION_TARGETS.find(t=> t.label.toLowerCase()===m[1].trim().toLowerCase());
    return target ? { targetSlug: target.slug, rest: m[2].trim() } : null;
  }

  async function autoReply(targetSlug, historyText){
    if(!sample) return;
    const title = roleTitle(targetSlug);
    if(targetSlug==='general'){
      try{
        const res = await sample(`Ты — ${title}, общий ассистент Eventer Workspace Кайрата Кульбаева, не привязан к одному направлению. Вот последние сообщения в чате направления «${curDir.name}»:\n\n${historyText}\n\nОтветь по существу на последнее сообщение, коротко и конкретно, на русском.`);
        await post(title, res.text, { role:true, to: targetSlug });
      }catch(e){}
      return;
    }
    const dirName = (DIRECTIONS.find(d=>d.slug===targetSlug)||{}).name || targetSlug;
    const crossNote = targetSlug!==dirSlug ? ` Сообщение пришло из чата направления «${curDir.name}» и адресовано тебе через @упоминание.` : '';
    try{
      const res = await sample(`Ты — ${title}, отвечаешь за направление «${dirName}» в Eventer Workspace Кайрата Кульбаева.${crossNote} Вот последние сообщения:\n\n${historyText}\n\nОтветь на последнее сообщение от своего лица как ${title}, коротко и конкретно, на русском.`);
      await post(title, res.text, { role:true, to: targetSlug });
    }catch(e){}
  }

  async function submit(){
    const raw = input.value.trim(); if(!raw) return;
    closeMention();
    const mention = parseMention(raw);
    const targetSlug = mention ? mention.targetSlug : dirSlug;
    const text = mention ? mention.rest : raw;
    if(!text) return;
    const authorName = (user && (await user.me())?.name) || 'Кайрат';
    input.value='';
    sendBtn.disabled = true;
    try{
      await post(authorName, text, mention ? { to: targetSlug } : undefined);
      const historyText = latest.slice(-15).map(m=>`${m.author}: ${m.text}`).join('\n') + `\n${authorName}: ${text}`;
      await autoReply(targetSlug, historyText);
    }catch(e){ alert('Не удалось отправить: '+(e&&e.code||e)); }
    sendBtn.disabled = false;
  }
  sendBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && mentionBox.style.display==='block'){
      e.preventDefault();
      const hi = mentionBox.querySelector('.mention-item.hi') || mentionBox.querySelector('.mention-item');
      if(hi) pickMention(hi.dataset.label);
      return;
    }
    if(e.key==='Enter'){ e.preventDefault(); submit(); }
  });
}

// ---------- Finance (Academy only, live from Google Sheets) ----------
// Standalone build: there's no Claude mcp connector here, so instead of
// sheets.get_values() this reads the sheet through Google's public gviz
// endpoint (works client-side, no API key, no login — requires only that
// the spreadsheet's general access is "Anyone with the link: Viewer",
// which it already is for these 3 sheets).
async function gvizFetchValues(spreadsheetId, sheetName, range){
  const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&range=${encodeURIComponent(range)}`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  if(!res.ok) throw Object.assign(new Error('gviz_http_'+res.status), { code: res.status===403 ? 'not_granted' : ('http_'+res.status) });
  const m = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if(!m) throw Object.assign(new Error('gviz_parse'), { code:'parse_error' });
  let json;
  try{ json = JSON.parse(m[1]); }catch(e){ throw Object.assign(new Error('gviz_parse'), { code:'parse_error' }); }
  if(json.status==='error'){
    throw Object.assign(new Error('gviz_error'), { code:'sheet_error' });
  }
  const rows = (json.table && json.table.rows) || [];
  const values = rows.map(r => (r.c||[]).map(c => {
    if(!c) return '';
    if(c.v!=null) return c.v;
    if(c.f!=null) return c.f;
    return '';
  }));
  return { values };
}
async function fetchYearFinance(year, refresh){
  const id = ACADEMY_SHEETS[year];
  const [pnl, cf, ue] = await Promise.all([
    gvizFetchValues(id, `P&L ${year}`, 'A1:O40'),
    gvizFetchValues(id, `Cash flow ${year}`, 'A1:O15'),
    gvizFetchValues(id, `Unit economics ${year}`, 'A1:H10'),
  ]);
  const pnlRows = pnl.values || [];
  const cfRows = cf.values || [];
  const ueRows = ue.values || [];
  const expenses = lastVal(findRow(pnlRows,'Итого расходы'));
  const revenue = lastVal(findRow(pnlRows,'Выручка'));
  const opResult = lastVal(findRow(pnlRows,'Операционный результат'));
  const netCash = lastVal(findRow(cfRows,'Чистый денежный поток'));
  const programs = ['Event-менеджер','Event-продюсер','Producer Bootcamp'].map(name=>{
    const row = findRow(ueRows, name);
    const students = row ? parseMoney(row[1]) : null;
    const rev = row ? parseMoney(row[4]) : null;
    return { name, students, revenue: rev };
  });
  const totalStudents = programs.reduce((s,p)=>s+(p.students||0),0);
  return { expenses, revenue, opResult, netCash, programs, totalStudents, fetchedAt: Date.now() };
}

function mktFmt(v, unit){
  if(v==null || v==='' || isNaN(v)) return '—';
  return unit==='money' ? fmtMoney(Number(v)) : fmtInt(Number(v));
}
function mktDeviation(fact, plan){
  if(fact==null || plan==null || plan===0 || isNaN(Number(fact)) || isNaN(Number(plan))) return null;
  return ((Number(fact)-Number(plan))/Math.abs(Number(plan)))*100;
}
function mktDevSpan(fact, plan){
  const dev = mktDeviation(fact, plan);
  if(dev==null) return '';
  const color = dev>=0 ? 'var(--good)' : 'var(--bad)';
  return `<span style="color:${color}">${dev>=0?'+':''}${dev.toFixed(0)}%</span>`;
}

function seedIfEmpty(){
  // First-run only: if a collection has never been written to in this
  // browser's localStorage, pre-populate it with the real data exported
  // from the live Eventer Workspace artifact, so the standalone site isn't
  // empty on first load. Once any row exists (including user edits), this
  // never overwrites it again.
  try{
    Object.keys(SEED_DATA).forEach(coll=>{
      const key = lsKey(coll);
      if(localStorage.getItem(key) === null){
        localStorage.setItem(key, JSON.stringify(SEED_DATA[coll]));
      }
    });
  }catch(e){ console.error('seed failed', e); }
}

function applyAppFixes(){
  // Runs on every boot (unlike seedIfEmpty, which only fires once on an
  // empty collection) so that already-populated devices still pick up
  // corrected/added app entries without wiping any other user edits.
  try{
    const key = lsKey('apps');
    let apps = JSON.parse(localStorage.getItem(key) || '[]');
    const fixes = [
      {id:'institute_atlas', direction:'institute', name:'EVENTER Atlas', url:'https://claude.ai/artifact/NR6yhervFk1psn8Hwwf8Tx'},
      {id:'afisha_atlas', direction:'afisha', name:'EVENTER Atlas', url:'https://claude.ai/artifact/NR6yhervFk1psn8Hwwf8Tx'},
      {id:'afisha_db', direction:'afisha', name:'Afisha Data Base', url:'https://claude.ai/artifact/3K2JSM8fxDYmQKHQDewCBk'}
    ];
    let changed = false;
    const toPush = [];
    fixes.forEach(fix=>{
      const idx = apps.findIndex(a=>a.id===fix.id);
      if(idx === -1){
        const row = {id:fix.id, direction:fix.direction, name:fix.name, url:fix.url, ts:0};
        apps.push(row); toPush.push(row); changed = true;
      } else if(apps[idx].url !== fix.url || apps[idx].name !== fix.name){
        apps[idx] = Object.assign({}, apps[idx], {url:fix.url, name:fix.name});
        toPush.push(apps[idx]); changed = true;
      }
    });
    if(changed) localStorage.setItem(key, JSON.stringify(apps));
    if(sb) toPush.forEach(row=>cloudUpsertRow('apps', row));
  }catch(e){ console.error('app fix failed', e); }
}

function flatFromRow(row){ return Object.assign({ id: row.id }, row.data||{}); }

async function syncAllFromCloud(){
  if(!sb) return false;
  const { data, error } = await sb.from('rows').select('*');
  if(error){ console.error('cloud fetch failed', error); return false; }
  const byColl = {};
  data.forEach(row=>{
    byColl[row.collection] = byColl[row.collection] || [];
    byColl[row.collection].push(flatFromRow(row));
  });
  // Mirror every known collection (including ones now empty in the cloud)
  // into the local cache so the UI's onSnapshot reads reflect cloud truth.
  const allColls = new Set([...Object.keys(SEED_DATA), ...Object.keys(byColl)]);
  allColls.forEach(coll=>{ lsWrite(coll, byColl[coll]||[]); });
  return true;
}

async function migrateLocalToCloudIfEmpty(){
  if(!sb) return;
  const { count, error } = await sb.from('rows').select('*', { count:'exact', head:true });
  if(error || (count && count>0)) return; // already has cloud data, don't touch it
  const payload = [];
  Object.keys(SEED_DATA).forEach(coll=>{
    const localRows = lsRead(coll);
    localRows.forEach(r=>{
      const { id, ...rest } = r;
      payload.push({ collection: coll, id, direction: rest.direction||null, ts: rest.ts||null, data: rest });
    });
  });
  if(!payload.length) return;
  // insert in chunks to stay well under request size limits
  for(let i=0;i<payload.length;i+=500){
    const chunk = payload.slice(i, i+500);
    const { error: insErr } = await sb.from('rows').insert(chunk);
    if(insErr){ console.error('migration chunk failed', insErr); }
  }
}

function subscribeRealtime(){
  if(!sb || realtimeChannel) return;
  realtimeChannel = sb.channel('rows-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'rows' }, payload=>{
      const coll = (payload.new && payload.new.collection) || (payload.old && payload.old.collection);
      if(!coll) return;
      const rows = lsRead(coll);
      if(payload.eventType === 'DELETE'){
        lsWrite(coll, rows.filter(r=>r.id !== payload.old.id));
      } else {
        const flat = flatFromRow(payload.new);
        const i = rows.findIndex(r=>r.id===flat.id);
        if(i<0) rows.push(flat); else rows[i]=flat;
        lsWrite(coll, rows);
      }
    })
    .subscribe();
}

const supaShim = {
  collection(coll){
    return Object.assign(makeQuery(coll, [], null, null), {
      add(obj){
        return new Promise(async (res,rej)=>{
          const id = uid();
          const rows = lsRead(coll); rows.push({ id, ...obj }); lsWrite(coll, rows); // optimistic
          if(sb){
            const { error } = await sb.from('rows').insert({ collection:coll, id, direction: obj.direction||null, ts: obj.ts||null, data: obj });
            if(error){ console.error('add failed', error); return rej(error); }
          }
          res({ id });
        });
      },
      doc(id){
        return {
          update(patch){
            return new Promise(async (res,rej)=>{
              const rows = lsRead(coll); const i = rows.findIndex(r=>r.id===id);
              if(i<0) return rej(new Error('not-found'));
              rows[i] = {...rows[i], ...patch}; lsWrite(coll, rows); // optimistic
              if(sb){
                const { id:_drop, ...data } = rows[i];
                const { error } = await sb.from('rows').update({ direction:data.direction||null, ts:data.ts||null, data }).eq('collection',coll).eq('id',id);
                if(error){ console.error('update failed', error); return rej(error); }
              }
              res();
            });
          },
          set(obj){
            return new Promise(async (res,rej)=>{
              const rows = lsRead(coll); const i = rows.findIndex(r=>r.id===id);
              if(i<0) rows.push({ id, ...obj }); else rows[i] = { id, ...obj };
              lsWrite(coll, rows); // optimistic
              if(sb){
                const { error } = await sb.from('rows').upsert({ collection:coll, id, direction: obj.direction||null, ts: obj.ts||null, data: obj }, { onConflict:'collection,id' });
                if(error){ console.error('set failed', error); return rej(error); }
              }
              res();
            });
          },
          delete(){
            return new Promise(async (res,rej)=>{
              lsWrite(coll, lsRead(coll).filter(r=>r.id!==id)); // optimistic
              if(sb){
                const { error } = await sb.from('rows').delete().eq('collection',coll).eq('id',id);
                if(error){ console.error('delete failed', error); return rej(error); }
              }
              res();
            });
          }
        };
      }
    });
  }
};

async function cloudUpsertRow(coll, flatRow){
  if(!sb) return;
  try{
    const { id, ...data } = flatRow;
    await sb.from('rows').upsert({ collection:coll, id, direction: data.direction||null, ts: data.ts||null, data }, { onConflict:'collection,id' });
  }catch(e){ console.error('cloud upsert failed', coll, e); }
}
