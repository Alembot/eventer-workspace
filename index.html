    <div style="font-size:12px;color:var(--rail-fg-dim);margin-top:2px">${roleLine}</div>
  </div>`;
  let listHtml = '';
  if(isRealAdmin()){
    listHtml = `<div style="font-size:10.5px;letter-spacing:.06em;color:var(--rail-fg-dim);margin:0 4px 6px">РЕЖИМ РАБОТЫ</div>` +
      (viewAsDirection ? `<div class="sheet-row" data-mode="admin"><div class="t">← Вернуться к администратору</div></div>` : '') +
      DIRECTIONS.map(d=>`<div class="sheet-row ${viewAsDirection===d.slug?'sel':''}" data-mode="${d.slug}">
        <div class="t">${directorTitle(d.slug)}</div><div class="s">Тестовый доступ · ${d.name}</div>
      </div>`).join('');
  }
  const teamHtml = isAdmin() ? `<div class="sheet-row" id="mnTeam" style="margin-top:8px"><div class="t">👥 Управление сотрудниками</div></div>` : '';
  const pushHtml = `<button id="mnPush" style="width:100%;margin-top:14px;padding:10px;font-size:13px;background:none;border:1px solid var(--rail-fg-dim);color:var(--rail-fg);border-radius:8px;cursor:pointer">${pushSubscribed ? '🔕 Выключить уведомления' : '🔔 Включить уведомления'}</button>`;
  modeBody.innerHTML = idHtml + listHtml + teamHtml + pushHtml + `<button id="mnLogout" style="width:100%;margin-top:8px;padding:10px;font-size:13px;background:none;border:1px solid var(--rail-fg-dim);color:var(--rail-fg);border-radius:8px;cursor:pointer">Выйти</button>`;
  modeBody.querySelectorAll('.sheet-row[data-mode]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const mode = row.dataset.mode;
      closeSheets();
      if(mode==='admin'){ viewAsDirection = null; location.hash = '#home'; }
      else { viewAsDirection = mode; location.hash = '#'+mode+'/tasks'; }
      parseRoute();
      render();
    });
  });
  const mnTeam = document.getElementById('mnTeam');
  if(mnTeam) mnTeam.addEventListener('click', ()=>{ closeSheets(); location.hash = '#team'; });
  const mnPush = document.getElementById('mnPush');
  if(mnPush) mnPush.addEventListener('click', ()=>{ closeSheets(); pushSubscribed ? disablePush() : enablePush(); });
  const mnLogout = document.getElementById('mnLogout');
  if(mnLogout) mnLogout.addEventListener('click', ()=>{ closeSheets(); if(sb) sb.auth.signOut(); });
}
function showAuth(msg, kind){
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  const m = document.getElementById('authMsg');
  if(msg){
    m.textContent = msg; m.style.display = 'block';
    m.style.background = kind==='error' ? 'color-mix(in srgb, var(--bad) 15%, transparent)' : 'color-mix(in srgb, var(--good) 15%, transparent)';
    m.style.color = kind==='error' ? 'var(--bad)' : 'var(--good)';
  } else { m.style.display = 'none'; }
}

// ---------- Roles: admin (Kairat, full access) vs employee (locked to one
// direction, read-only on Решения/Контекст — enforced both here in the UI
// and, as the real security boundary, by the Supabase RLS policies). ----------
let currentProfile = null; // { id, email, role: 'admin'|'employee', direction }
// "Войти как" — admin-only preview: pretend to be an employee scoped to this
// direction. The real Supabase session underneath is still full-admin (so
// nothing breaks if the preview is dropped), only the UI restricts itself —
// this is how the admin decides, by trying it, what an employee should see.
let viewAsDirection = null;
// Whether the "РЕЖИМ РАБОТЫ" dropdown is expanded — collapsed by default,
// showing only the active row, so the sidebar isn't dominated by 15 rows.
let modeListOpen = false;
function isRealAdmin(){ return !!(currentProfile && currentProfile.role === 'admin'); }
function isAdmin(){ return isRealAdmin() && !viewAsDirection; }
function employeeDirection(){
  if(viewAsDirection) return viewAsDirection;
  return (!isRealAdmin() && currentProfile) ? currentProfile.direction : null;
}
async function loadProfile(){
  if(!sb) { currentProfile = null; return; }
  const { data: sess } = await sb.auth.getSession();
  const uid = sess && sess.session && sess.session.user && sess.session.user.id;
  if(!uid){ currentProfile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if(error){ console.error('profile load failed', error); currentProfile = null; return; }
  currentProfile = data || null;
}

// ---------- Web Push notifications (new messages, meeting reminders, task
// digests) — service worker registered once, subscription stored per device
// in Supabase so the server (Edge Functions) can push to it. ----------
const VAPID_PUBLIC_KEY = 'BHoObAhcVwEAJjsUStAC38TFYItEOdPuYYCRbnPiw_iRIOyBa-Bg65nGp0H62LDMb2x6aw2X0nEq7T1x0vlbgqs';
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
let swReg = null;
let pushSubscribed = false;
async function initPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    swReg = await navigator.serviceWorker.register('sw.js');
    const sub = await swReg.pushManager.getSubscription();
    pushSubscribed = !!sub;
  }catch(e){ console.error('sw register failed', e); }
}
async function enablePush(){
  if(!swReg) await initPush();
  if(!swReg){ alert('Уведомления не поддерживаются в этом браузере.'); return; }
  if(Notification.permission === 'denied'){
    alert('Уведомления заблокированы для этого сайта в настройках браузера — разреши их вручную и попробуй снова.');
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') return;
  try{
    const sub = await swReg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const { data: sess } = await sb.auth.getSession();
    const uid = sess && sess.session && sess.session.user && sess.session.user.id;
    if(!uid) return;
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: uid,
      endpoint: j.endpoint,
      p256dh: j.keys.p256dh,
      auth: j.keys.auth,
      direction: currentProfile ? currentProfile.direction : null,
    }, { onConflict: 'endpoint' });
    if(error) throw error;
    pushSubscribed = true;
  }catch(e){ console.error('push subscribe failed', e); alert('Не получилось включить уведомления: ' + (e && e.message || e)); }
  render();
}
async function disablePush(){
  if(!swReg){ pushSubscribed = false; render(); return; }
  try{
    const sub = await swReg.pushManager.getSubscription();
    if(sub){
      if(sb) await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
  }catch(e){ console.error('push unsubscribe failed', e); }
  pushSubscribed = false;
  render();
}

async function startAppWithCloud(){
  db = supaShim;
  await loadProfile();
  if(!isAdmin() && !employeeDirection()){
    // Signed in, but no admin has assigned a direction yet — show a plain
    // waiting screen instead of a broken/empty Workspace.
    showApp();
    document.getElementById('main').innerHTML = `
      <div class="header"><div><div class="eyebrow">доступ</div><h1>Ожидание назначения</h1></div></div>
      <div class="card" style="max-width:480px">
        <div style="margin-bottom:10px">Ваш аккаунт подтверждён (${(currentProfile&&currentProfile.email)||''}), но администратор ещё не назначил вам направление. Обратитесь к Кайрату.</div>
        <button class="btn ghost" id="waitLogout">Выйти</button>
      </div>`;
    document.getElementById('railList').innerHTML = '';
    const lo = document.getElementById('waitLogout');
    if(lo) lo.addEventListener('click', ()=> sb.auth.signOut());
    return;
  }
  await migrateLocalToCloudIfEmpty();
  await syncAllFromCloud();
  subscribeRealtime();
  applyAppFixes();
  applySystemDecisions();
  showApp();
  parseRoute();
  render();
}

function wireAuthScreen(){
  const emailI = document.getElementById('authEmail');
  const passI = document.getElementById('authPass');
  document.getElementById('authSignIn').addEventListener('click', async ()=>{
    if(!sb) return showAuth('Supabase недоступен в этом окне.', 'error');
    const email = emailI.value.trim(), password = passI.value;
    if(!email || !password) return showAuth('Введи почту и пароль.', 'error');
    showAuth('Входим…');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) return showAuth(error.message==='Invalid login credentials' ? 'Неверная почта или пароль.' : error.message, 'error');
    await startAppWithCloud();
  });
  document.getElementById('authSignUp').addEventListener('click', async ()=>{
    if(!sb) return showAuth('Supabase недоступен в этом окне.', 'error');
    const email = emailI.value.trim(), password = passI.value;
    if(!email || !password) return showAuth('Введи почту и придумай пароль.', 'error');
    if(password.length < 6) return showAuth('Пароль должен быть не короче 6 символов.', 'error');
    showAuth('Создаём доступ…');
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error) return showAuth(error.message, 'error');
    if(data.session){ await startAppWithCloud(); return; }
    showAuth('Письмо отправлено на ' + email + ' — открой его и перейди по ссылке, затем вернись сюда и нажми «Войти».');
  });
}

function applySystemDecisions(){
  // Same boot-time merge pattern as applyAppFixes: add specific system-wide
  // decisions by id if missing, without touching anything else the user
  // has already added/edited in this collection.
  try{
    const key = lsKey('decisions');
    let decisions = JSON.parse(localStorage.getItem(key) || '[]');
    const adds = [
      {id:'sys_dec_2026_10_03_eventer_workspace', direction:'backoffice', ws_id:1, text:
        '[ПРИНЯТО] Eventer Workspace — единый источник решений, контекста и задач\n\n' +
        'С 03.10.2026 Eventer Workspace (https://alembot.github.io/eventer-workspace/) — основная рабочая система по всем 14 направлениям бизнеса. Все новые решения, контекст и задачи фиксируются только здесь, в блоках «Решения», «Контекст», «Задачи» соответствующего направления.\n\n' +
        'K-Workspace (kairat-workspace.k-rahimzhan.chatgpt.site) и его Главный менеджер переходят в статус справочного источника — только для обращения за старой информацией, зафиксированной до перехода. Новые записи туда больше не вносятся.\n\n' +
        'Обоснование: iOS Universal Links делали K-Workspace неудобным как приложение на главном экране телефона; переход на собственный Eventer Workspace убирает эту проблему и закрепляет единственный актуальный источник данных для всех менеджеров и направлений.'}
    ];
    let changed = false;
    const toPush = [];
    adds.forEach(dec=>{
      if(!decisions.find(d=>d.id===dec.id)){
        const row = Object.assign({done:false, ts:Date.now()}, dec);
        decisions.push(row); toPush.push(row); changed = true;
      }
    });
    if(changed) localStorage.setItem(key, JSON.stringify(decisions));
    if(sb) toPush.forEach(row=>cloudUpsertRow('decisions', row));
  }catch(e){ console.error('system decision seed failed', e); }
}

async function boot(){
  // Local cache is seeded/patched first either way, so there's baseline
  // content to show immediately and to migrate up on first cloud login.
  seedIfEmpty();
  applyAppFixes();
  applySystemDecisions();
  wireAuthScreen();

  if(!sb){
    // Supabase unreachable in this window (blocked script, offline, etc.):
    // fall back to the old local-only mode rather than blocking on a login
    // screen that can never succeed.
    db = dbShim;
    showApp();
    parseRoute();
    render();
    return;
  }

  let session = null;
  try{
    const { data } = await sb.auth.getSession();
    session = data && data.session;
  }catch(e){ console.error('getSession failed', e); }

  if(session){
    await startAppWithCloud();
  } else {
    showAuth();
  }

  // Pick up magic-link/email-confirmation redirects and cross-tab session changes.
  sb.auth.onAuthStateChange((event, sess)=>{
    if(event === 'SIGNED_IN' && sess && db !== supaShim){
      startAppWithCloud();
    } else if(event === 'SIGNED_OUT'){
      location.reload();
    }
  });
}
if(!location.hash) location.hash = '#academy/finance';
boot();
</script>
